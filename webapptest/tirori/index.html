<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ギャップレスループ＋停止音プリロード</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      margin: 0;
      cursor: pointer;
    }
    #slideshow {
      box-shadow: 0 2px 8px #bbb;
      border-radius: 8px;
      background: #fff;
      padding: 20px;
      max-width: 90vw;
      max-height: 90vh;
    }
    img {
      max-width: 100%;
      max-height: 70vh;
      height: auto;
      width: auto;
      display: block;
      margin: 0 auto;
      border-radius: 4px;
    }
    #message {
      margin-top: 20px;
      color: #666;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- スライドショー -->
  <div id="slideshow">
    <img id="slide-img" src="1.jpg" alt="スライド画像">
  </div>

  <!-- メッセージ -->
  <div id="message">画面をタップすると再生が始まります</div>



  <script>
    // 状態管理
    let running = false;
    let slideTimer = null;
    let sourceNode = null;
    let audioContext = null;

    const images = ["1.jpg", "2.jpg"];
    let index = 0;



    // スライドショー開始
    function startSlideshow() {
      slideTimer = setInterval(() => {
        index = (index + 1) % images.length;
        document.getElementById('slide-img').src = images[index];
      }, 500);
    }

    // スライドショー停止
    function stopSlideshow() {
      clearInterval(slideTimer);
      document.getElementById('slide-img').src = "1.jpg";
      index = 0;
    }

    // 音声バッファをキャッシュ
    let loopAudioBuffer = null;
    let stopAudioBuffer = null;

    // 音声ファイルをプリロード
    async function preloadAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      try {
        // ループ音声をプリロード
        if (!loopAudioBuffer) {
          const loopResponse = await fetch('tirori_loop.wav');
          const loopArrayBuffer = await loopResponse.arrayBuffer();
          loopAudioBuffer = await audioContext.decodeAudioData(loopArrayBuffer);
        }

        // 停止音をプリロード
        if (!stopAudioBuffer) {
          const stopResponse = await fetch('tirori_stop.wav');
          const stopArrayBuffer = await stopResponse.arrayBuffer();
          stopAudioBuffer = await audioContext.decodeAudioData(stopArrayBuffer);
        }
      } catch (e) {
        console.error('音声プリロードに失敗:', e);
      }
    }

    // ループ音声開始（改善版）
    async function startLoopAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      // AudioContextが停止状態の場合は再開
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      // プリロードされていない場合は読み込み
      if (!loopAudioBuffer) {
        await preloadAudio();
      }

      sourceNode = audioContext.createBufferSource();
      sourceNode.buffer = loopAudioBuffer;
      sourceNode.loop = true;
      sourceNode.connect(audioContext.destination);
      sourceNode.start(0);
    }

    // ループ音声停止（改善版）
    function stopLoopAudio() {
      if (sourceNode) {
        sourceNode.stop();
        sourceNode.disconnect();
        sourceNode = null;
      }
      // AudioContextは再利用のため閉じない
    }

    // 停止音をWeb Audio APIで再生（ギャップレス対応）
    async function playStopAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      // AudioContextが停止状態の場合は再開
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      // プリロードされていない場合は読み込み
      if (!stopAudioBuffer) {
        await preloadAudio();
      }
      
      try {
        const stopSourceNode = audioContext.createBufferSource();
        stopSourceNode.buffer = stopAudioBuffer;
        stopSourceNode.connect(audioContext.destination);
        stopSourceNode.start(0);
        
        // 停止音の再生完了を待つ
        return new Promise((resolve) => {
          stopSourceNode.onended = resolve;
        });
      } catch (e) {
        console.error('停止音の再生に失敗:', e);
        throw e;
      }
    }

    // タップイベント
    window.addEventListener('click', async () => {
      const message = document.getElementById('message');

      if (!running) {
        // 再生開始
        running = true;
        message.textContent = "再生中：もう一度タップで停止";
        try {
          await startLoopAudio();
        } catch (e) {
          message.textContent = "音声再生に失敗しました";
          return;
        }
        startSlideshow();
      } else {
        // 停止処理
        running = false;
        stopSlideshow();
        stopLoopAudio();
        message.textContent = "停止音再生中...";
        try {
          await playStopAudio();
          message.textContent = "停止しました。再度タップで再開します";
        } catch (e) {
          message.textContent = "停止音の再生に失敗しました";
          console.error(e);
        }
      }
    });

    // ページ読み込み時に音声をプリロード
    window.addEventListener('DOMContentLoaded', async () => {
      // ユーザーの最初のタップ時に音声を初期化するため、ここでは何もしない
      // モバイルブラウザではユーザーインタラクション後でないと音声コンテキストを作成できない
    });
  </script>

</body>
</html>
