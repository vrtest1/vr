<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#171717">
  <title>Web Drum Machine</title>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #171717;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      touch-action: none;
    }

    .drum-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4/3;
      position: relative;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 1rem;
    }

    /* スマートフォン（縦向き）用のスタイル */
    @media (max-width: 480px) {
      .drum-container {
        width: calc(100% - 2rem);
        margin: 1rem;
        aspect-ratio: 3/4;
      }
      .pad-large { width: 24vw !important; height: 24vw !important; }
      .pad-medium { width: 20vw !important; height: 20vw !important; }
      .pad-small { width: 18vw !important; height: 18vw !important; }
    }

    /* スマートフォン（横向き）用のスタイル */
    @media (min-width: 481px) and (max-width: 840px) {
      .drum-container {
        width: calc(100% - 2rem);
        margin: 1rem;
      }
      .pad-large { width: 20vw !important; height: 20vw !important; }
      .pad-medium { width: 16vw !important; height: 16vw !important; }
      .pad-small { width: 14vw !important; height: 14vw !important; }
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Debug Console -->
  <div id="debug-console" style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: white; font-family: monospace; font-size: 12px; padding: 10px; max-height: 30vh; overflow-y: auto; z-index: 9999;"></div>

  <!-- Audio Elements -->
  <script>
    const debugConsole = document.getElementById('debug-console');
    function log(type, ...args) {
      const line = document.createElement('div');
      line.style.color = type === 'error' ? '#ff6b6b' : type === 'warn' ? '#ffd93d' : '#ffffff';
      line.textContent = `${type}: ${args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
      ).join(' ')}`;
      debugConsole.appendChild(line);
      debugConsole.scrollTop = debugConsole.scrollHeight;
    }

    const audioElements = new Map();
    let initialized = false;
    let hasUserInteraction = false;

    // 音声バッファをキャッシュ
    const audioBufferCache = new Map();

    // 音声システムの初期化
    async function initializeAudio() {
      if (initialized) return;
      
      log('log', 'Initializing audio system...');
      
      const samples = [
        { id: 'kick', src: 'samples/kick.wav' },
        { id: 'snare', src: 'samples/snare.wav' },
        { id: 'hihat', src: 'samples/hihat.wav' },
        { id: 'tom1', src: 'samples/tom1.wav' },
        { id: 'tom2', src: 'samples/tom2.wav' },
        { id: 'floortom', src: 'samples/floortom.wav' },
        { id: 'crash', src: 'samples/crash.wav' },
        { id: 'ride', src: 'samples/ride.wav' }
      ];

      try {
        // サイレントバッファの作成（iOS用）
        const silentBuffer = new AudioContext().createBuffer(1, 1, 22050);

        await Promise.all(samples.map(async ({ id, src }) => {
          const audio = new Audio();
          audio.preload = 'auto';
          
          // iOS対応の設定
          audio.playsInline = true;
          audio.controls = false;
          
          // 音声ファイルのプリロード
          await new Promise((resolve, reject) => {
            audio.addEventListener('canplaythrough', resolve, { once: true });
            audio.addEventListener('error', reject, { once: true });
            audio.src = src;
            audio.load();
          });

          // 音量0で事前再生してバッファをキャッシュ（iOS用）
          audio.volume = 0;
          await audio.play().catch(() => {});
          audio.pause();
          audio.currentTime = 0;
          audio.volume = 1;
          
          // 複製を作成（同時再生用）
          const clonedAudio = audio.cloneNode(true);
          audioElements.set(id, [audio, clonedAudio]);
          log('log', `Loaded audio for ${id}`);
        }));

        initialized = true;
        log('log', 'Audio system initialized successfully');
      } catch (error) {
        log('error', 'Failed to initialize audio:', error);
      }
    }

    // 音声再生の最適化
    let lastPlayTime = 0;
    const MIN_PLAY_INTERVAL = 50; // ミリ秒

    async function playSound(id) {
      if (!hasUserInteraction) {
        log('warn', 'Attempting to enable audio...');
        await enableAudio();
        if (!hasUserInteraction) {
          log('warn', 'Still waiting for user interaction...');
          return;
        }
      }

      const now = Date.now();
      if (now - lastPlayTime < MIN_PLAY_INTERVAL) {
        log('warn', 'Playing too fast, skipping...');
        return;
      }
      lastPlayTime = now;

      const audioArray = audioElements.get(id);
      if (!audioArray) {
        log('error', `No audio found for ${id}`);
        return;
      }

      try {
        // 利用可能なAudio要素を探す
        const audio = audioArray.find(a => a.paused) || audioArray[0];
        
        // 再生中の場合は停止してリセット
        if (!audio.paused) {
          audio.pause();
          audio.currentTime = 0;
        }

        audio.currentTime = 0;
        await audio.play();
        log('log', `Playing sound: ${id}`);
      } catch (error) {
        log('error', `Failed to play ${id}:`, error);
      }
    }

    // オーディオシステムの有効化（サイレント）
    async function enableAudio() {
      if (hasUserInteraction) return;
      
      log('log', 'Enabling audio system...');
      hasUserInteraction = true;

      // サイレントで初期化
      const silentAudio = new Audio();
      silentAudio.volume = 0;
      try {
        await silentAudio.play();
        silentAudio.pause();
        log('log', 'Audio system enabled');
      } catch (error) {
        log('error', 'Failed to enable audio:', error);
      }
    }

    // ユーザーインタラクションイベントの処理
    function handleUserInteraction(e) {
      if (!hasUserInteraction) {
        log('log', `User interaction detected: ${e.type}`);
        enableAudio();
      }
    }

    // イベントリスナーの設定
    ['click', 'touchstart', 'keydown'].forEach(eventType => {
      window.addEventListener(eventType, handleUserInteraction, { once: true });
    });
  </script>

  <!-- Drum Machine -->
  <script type="text/babel" data-presets="env,react">
    const PADS = [
      { id:'kick', label:'Kick', key:'A', x:'50%', y:'70%', size:'pad-large w-40 h-40' },
      { id:'snare',label:'Snare',key:'S', x:'35%', y:'50%', size:'pad-medium w-32 h-32'},
      { id:'hihat',label:'Hi-Hat',key:'D',x:'20%', y:'40%', size:'pad-small w-28 h-28'},
      { id:'tom1', label:'Tom 1', key:'F', x:'50%', y:'40%', size:'pad-small w-28 h-28'},
      { id:'tom2', label:'Tom 2', key:'G', x:'65%', y:'45%', size:'pad-small w-28 h-28'},
      { id:'floortom',label:'Floor Tom',key:'H',x:'80%',y:'60%', size:'pad-medium w-32 h-32'},
      { id:'crash',label:'Crash',key:'J',x:'30%',y:'25%', size:'pad-medium w-32 h-32'},
      { id:'ride', label:'Ride', key:'K', x:'70%', y:'30%', size:'pad-medium w-32 h-32'},
    ];

    const DrumPad = React.memo(({ pad, active, onTrigger }) => {
      const handleInteraction = React.useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        onTrigger(pad);
      }, [pad, onTrigger]);

      return (
        <button
          onClick={handleInteraction}
          onTouchStart={handleInteraction}
          className={`${pad.size} absolute select-none rounded-full flex items-center justify-center text-white font-bold shadow-lg 
            ${active ? 'bg-neutral-600/90 scale-95' : 'bg-neutral-700/90 scale-100'} 
            hover:bg-neutral-600/90 hover:shadow-2xl transition-all duration-100
            active:bg-neutral-600/90 active:scale-95`}
          style={{ 
            left: pad.x, 
            top: pad.y, 
            transform: 'translate(-50%, -50%)'
          }}
        >
          <span className="pointer-events-none text-[min(2vw,1rem)] md:text-base">
            {pad.label}<br/>
            <span className="opacity-70 text-[min(1.5vw,0.75rem)] md:text-xs">[{pad.key}]</span>
          </span>
        </button>
      );
    });

    function DrumMachine() {
      const [activePad, setActivePad] = React.useState(null);
      const [ready, setReady] = React.useState(false);

      React.useEffect(() => {
        initializeAudio().then(() => setReady(true));
      }, []);

      const triggerPad = React.useCallback((pad) => {
        playSound(pad.id);
        setActivePad(pad.id);
        setTimeout(() => setActivePad(null), 100);
      }, []);

      React.useEffect(() => {
        const handleKey = (e) => {
          const pad = PADS.find(p => p.key.toLowerCase() === e.key.toLowerCase());
          if (pad) {
            triggerPad(pad);
            handleUserInteraction(e); // キー入力でもオーディオを有効化
          }
        };

        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [triggerPad]);

      if (!ready) {
        return (
          <div className="drum-container bg-gradient-to-br from-neutral-800 via-neutral-900 to-black rounded-2xl flex items-center justify-center">
            <div className="text-white text-lg">Loading...</div>
          </div>
        );
      }

      return (
        <div className="drum-container bg-gradient-to-br from-neutral-800 via-neutral-900 to-black rounded-2xl">
          {PADS.map(p => (
            <DrumPad 
              key={p.id} 
              pad={p} 
              active={activePad === p.id} 
              onTrigger={triggerPad}
            />
          ))}
          <footer className="absolute bottom-2 right-4 text-neutral-400 text-xs select-none">
            タップまたはキーを押して演奏
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <React.StrictMode>
        <DrumMachine />
      </React.StrictMode>
    );
  </script>
</body>
</html>
