<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#171717">
  <title>Web Drum Machine</title>

  <!-- Tailwind (CDN for quick demo) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM (Production) -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel 7 standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #171717;
      overscroll-behavior: none;
    }
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .drum-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4/3;
      position: relative;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 1rem;
    }

    /* スマートフォン（縦向き）用のスタイル */
    @media (max-width: 480px) {
      .drum-container {
        width: calc(100% - 2rem);
        margin: 1rem;
        aspect-ratio: 3/4;
      }
      .pad-large { width: 24vw !important; height: 24vw !important; }
      .pad-medium { width: 20vw !important; height: 20vw !important; }
      .pad-small { width: 18vw !important; height: 18vw !important; }
    }

    /* スマートフォン（横向き）用のスタイル */
    @media (min-width: 481px) and (max-width: 840px) {
      .drum-container {
        width: calc(100% - 2rem);
        margin: 1rem;
      }
      .pad-large { width: 20vw !important; height: 20vw !important; }
      .pad-medium { width: 16vw !important; height: 16vw !important; }
      .pad-small { width: 14vw !important; height: 14vw !important; }
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Debug Console -->
  <div id="debug-console" style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: white; font-family: monospace; font-size: 12px; padding: 10px; max-height: 30vh; overflow-y: auto; z-index: 9999;"></div>

  <script>
    // デバッグコンソールの設定
    const debugConsole = document.getElementById('debug-console');
    const originalConsole = {
      log: console.log,
      error: console.error,
      warn: console.warn
    };

    function addToDebugConsole(type, ...args) {
      const line = document.createElement('div');
      line.style.color = type === 'error' ? '#ff6b6b' : type === 'warn' ? '#ffd93d' : '#ffffff';
      line.textContent = `${type}: ${args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
      ).join(' ')}`;
      debugConsole.appendChild(line);
      debugConsole.scrollTop = debugConsole.scrollHeight;
      
      // 元のコンソール関数も呼び出す
      originalConsole[type](...args);
    }

    // コンソール関数をオーバーライド
    console.log = (...args) => addToDebugConsole('log', ...args);
    console.error = (...args) => addToDebugConsole('error', ...args);
    console.warn = (...args) => addToDebugConsole('warn', ...args);

    // エラーハンドリング
    window.onerror = function(msg, url, line, col, error) {
      console.error(`Error: ${msg}\nAt: ${url}:${line}:${col}`);
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      console.error('Unhandled Promise Rejection:', event.reason);
    });
  </script>

  <!-- Audio Context Initialization -->
  <script>
    let audioCtx = null;
    let gainNode = null;
    const audioBuffers = new Map();
    let unlocked = false;

    async function unlockAudioContext(context) {
      console.log('Attempting to unlock audio context...');
      if (context.state === 'suspended' && !unlocked) {
        await context.resume();
        
        // iOS用の特別な処理
        const buffer = context.createBuffer(1, 1, 22050);
        const source = context.createBufferSource();
        source.buffer = buffer;
        source.connect(context.destination);
        
        // タイミングを指定して確実に再生
        const startTime = context.currentTime;
        source.start(startTime);
        source.stop(startTime + 0.001);
        
        unlocked = true;
        console.log('Audio context unlocked successfully');
      }
    }

    async function initAudioContext() {
      console.log('Initializing Audio Context...');
      if (audioCtx) {
        console.log('Audio Context already exists');
        return;
      }
      
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext({ sampleRate: 44100 });
        console.log('Audio Context created, state:', audioCtx.state);
        
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 1.0;
        gainNode.connect(audioCtx.destination);
        console.log('Gain Node connected');

        // 音声コンテキストのアンロックを試みる
        await unlockAudioContext(audioCtx);
      } catch (error) {
        console.error('Failed to initialize Audio Context:', error);
      }
    }

    async function loadAudio(url) {
      console.log('Loading audio:', url);
      if (!audioCtx) {
        console.warn('Audio Context not initialized');
        return null;
      }
      if (audioBuffers.has(url)) {
        console.log('Using cached audio buffer for:', url);
        return audioBuffers.get(url);
      }

      try {
        console.log('Fetching:', url);
        const response = await fetch(url);
        console.log('Fetch response status:', response.status);
        const arrayBuffer = await response.arrayBuffer();
        console.log('Array buffer received, size:', arrayBuffer.byteLength);
        
        // デコード前に必要に応じてコンテキストをアンロック
        await unlockAudioContext(audioCtx);
        
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        console.log('Audio decoded successfully');
        audioBuffers.set(url, audioBuffer);
        return audioBuffer;
      } catch (error) {
        console.error('Error loading audio:', url, error);
        return null;
      }
    }

    async function playSound(buffer) {
      if (!buffer || !audioCtx) {
        console.warn('Cannot play sound: buffer or context missing');
        return;
      }
      
      try {
        // 再生前に必要に応じてコンテキストをアンロック
        await unlockAudioContext(audioCtx);
        
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(gainNode);
        
        // タイミングを指定して確実に再生
        const startTime = audioCtx.currentTime;
        source.start(startTime);
        console.log('Sound played successfully at time:', startTime);
      } catch (error) {
        console.error('Error playing sound:', error);
      }
    }
  </script>

  <!-- Drum Machine -->
  <script type="text/babel" data-presets="env,react">
    const PADS = [
      { id:'kick', label:'Kick',  key:'A', src:'samples/kick.wav',  x:'50%', y:'70%', size:'pad-large w-40 h-40' },
      { id:'snare',label:'Snare',key:'S', src:'samples/snare.wav', x:'35%', y:'50%', size:'pad-medium w-32 h-32'},
      { id:'hihat',label:'Hi-Hat',key:'D', src:'samples/hihat.wav',x:'20%', y:'40%', size:'pad-small w-28 h-28'},
      { id:'tom1', label:'Tom 1', key:'F', src:'samples/tom1.wav', x:'50%', y:'40%', size:'pad-small w-28 h-28'},
      { id:'tom2', label:'Tom 2', key:'G', src:'samples/tom2.wav', x:'65%', y:'45%', size:'pad-small w-28 h-28'},
      { id:'floortom',label:'Floor Tom',key:'H',src:'samples/floortom.wav',x:'80%',y:'60%', size:'pad-medium w-32 h-32'},
      { id:'crash',label:'Crash',key:'J',src:'samples/crash.wav',x:'30%',y:'25%', size:'pad-medium w-32 h-32'},
      { id:'ride', label:'Ride', key:'K', src:'samples/ride.wav',  x:'70%', y:'30%', size:'pad-medium w-32 h-32'},
    ];

    const DrumPad = React.memo(({ pad, active, onTrigger }) => {
      const handleInteraction = React.useCallback((e) => {
        e.preventDefault();
        // タッチイベントの場合、即座にトリガー
        if (e.type === 'touchstart') {
          onTrigger(pad);
        }
        // クリックイベントの場合、タッチでない場合のみトリガー
        else if (e.type === 'click' && !e.sourceCapabilities?.firesTouchEvents) {
          onTrigger(pad);
        }
      }, [pad, onTrigger]);

      return (
        <button
          onClick={handleInteraction}
          onTouchStart={handleInteraction}
          className={`${pad.size} absolute select-none rounded-full flex items-center justify-center text-white font-bold shadow-lg 
            ${active ? 'bg-neutral-600/90 scale-95' : 'bg-neutral-700/90 scale-100'} 
            hover:bg-neutral-600/90 hover:shadow-2xl transition-all duration-100
            active:bg-neutral-600/90 active:scale-95`}
          style={{ 
            left: pad.x, 
            top: pad.y, 
            transform: 'translate(-50%, -50%)'
          }}
        >
          <span className="pointer-events-none text-[min(2vw,1rem)] md:text-base">
            {pad.label}<br/>
            <span className="opacity-70 text-[min(1.5vw,0.75rem)] md:text-xs">[{pad.key}]</span>
          </span>
        </button>
      );
    });

    function DrumMachine() {
      const [activePad, setActivePad] = React.useState(null);
      const [ready, setReady] = React.useState(false);
      const soundBuffers = React.useRef({});
      const isInitialized = React.useRef(false);

      const initializeAudio = React.useCallback(async () => {
        console.log('Starting audio initialization...');
        if (isInitialized.current) {
          console.log('Already initialized');
          return;
        }
        
        try {
          console.log('Initializing Audio Context...');
          await initAudioContext();
          
          console.log('Loading sound samples...');
          await Promise.all(
            PADS.map(async (pad) => {
              console.log(`Loading sample: ${pad.id}`);
              soundBuffers.current[pad.id] = await loadAudio(pad.src);
            })
          );

          isInitialized.current = true;
          setReady(true);
          console.log('Audio initialization complete');
        } catch (error) {
          console.error('Failed to initialize audio:', error);
          setReady(true);
        }
      }, []);

      const handleInteraction = React.useCallback(async (e) => {
        if (!ready) {
          await initializeAudio();
        }
      }, [ready, initializeAudio]);

      React.useEffect(() => {
        const handleInteractionEvent = async (e) => {
          if (!isInitialized.current) {
            await handleInteraction(e);
          }
        };

        document.addEventListener('touchstart', handleInteractionEvent, { once: true });
        document.addEventListener('click', handleInteractionEvent, { once: true });

        return () => {
          document.removeEventListener('touchstart', handleInteractionEvent);
          document.removeEventListener('click', handleInteractionEvent);
        };
      }, [handleInteraction]);

      const triggerPad = React.useCallback(async (pad) => {
        if (!isInitialized.current) {
          await initializeAudio();
        }
        const buffer = soundBuffers.current[pad.id];
        if (buffer) {
          await playSound(buffer);
        }
        setActivePad(pad.id);
        setTimeout(() => setActivePad(null), 100);
      }, [initializeAudio]);

      React.useEffect(() => {
        const handleKey = (e) => {
          const pad = PADS.find(p => p.key.toLowerCase() === e.key.toLowerCase());
          if (pad) triggerPad(pad);
        };

        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [triggerPad]);

      if (!ready) {
        return (
          <div 
            className="drum-container bg-gradient-to-br from-neutral-800 via-neutral-900 to-black rounded-2xl flex items-center justify-center"
            onClick={handleInteraction}
            onTouchStart={handleInteraction}
          >
            <div className="text-white text-lg">タップしてスタート...</div>
          </div>
        );
      }

      return (
        <div className="drum-container bg-gradient-to-br from-neutral-800 via-neutral-900 to-black rounded-2xl">
          {PADS.map(p => (
            <DrumPad 
              key={p.id} 
              pad={p} 
              active={activePad === p.id} 
              onTrigger={triggerPad}
            />
          ))}
          <footer className="absolute bottom-2 right-4 text-neutral-400 text-xs select-none">
            タップまたはキーを押して演奏
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <React.StrictMode>
        <DrumMachine />
      </React.StrictMode>
    );
  </script>
</body>
</html>
