<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>808 COWBELL — TAP SYNC</title>
<style>
:root{color-scheme:dark;--bg:#090a12;--line:#2a3157;--text:#f5f6ff;--muted:#9aa4c7;--hot:#ff4fd8;--cyan:#4de8ff}
*{box-sizing:border-box}html,body,.app,button,input{touch-action:manipulation}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#20275a 0,#0b0d18 38%,#05060b 100%);font-family:system-ui,-apple-system,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}
.app{width:min(720px,100%);background:#0b0e1be8;border:1px solid #313963;border-radius:28px;padding:24px;box-shadow:0 24px 80px #0008}
h1{margin:0;font-size:clamp(28px,8vw,58px);letter-spacing:.08em;text-align:center}.sub{text-align:center;color:var(--muted);margin:5px 0 22px}
.display{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#050713;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.big{font:700 clamp(34px,9vw,66px)/1 ui-monospace,monospace}.label{font-size:12px;color:var(--muted);letter-spacing:.12em;margin-top:7px}
.pulse{width:15px;height:15px;border-radius:50%;background:#333;margin:11px auto 0}.pulse.on{background:var(--cyan);box-shadow:0 0 24px var(--cyan)}
.tapcount{text-align:center;margin:12px 0;color:var(--cyan);font:700 16px ui-monospace,monospace}
.modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{border:0;border-radius:18px;padding:18px 12px;font-weight:800;font-size:16px;color:#090a12;background:linear-gradient(90deg,var(--cyan),var(--hot));cursor:pointer}
button.active{background:#ff5570;color:#fff}.manual{background:linear-gradient(90deg,#ffd84d,#ff4fd8);font-size:18px}.syncbig{width:100%;margin-top:12px;padding:28px 16px;font-size:clamp(22px,6vw,34px);letter-spacing:.06em;background:linear-gradient(90deg,#4de8ff,#7d8cff);box-shadow:0 8px 28px #4de8ff30}.syncbig:active{transform:scale(.985);filter:brightness(1.2)}.manual:active{transform:scale(.97);filter:brightness(1.25)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:11px 0 0}.controls{display:grid;gap:15px;margin-top:18px}.row{display:grid;grid-template-columns:150px 1fr 58px;gap:10px;align-items:center}.row label{font-size:14px}.row output{text-align:right;color:var(--cyan)}
input[type=range]{width:100%}.status{min-height:42px;text-align:center;color:var(--muted);margin-top:15px;font-size:13px}.foot{text-align:center;color:#697293;font-size:11px;margin-top:12px}
@media(max-width:520px){.app{padding:18px}.row{grid-template-columns:105px 1fr 48px}.modebar{grid-template-columns:1fr}.modebar button{padding:16px}}
</style>
</head>
<body>
<main class="app">
<h1>808 COWBELL</h1>
<div class="sub">TAP SYNC — 人間が耳、ブラウザが時計</div>
<section class="display">
 <div class="box"><div id="bpm" class="big">--</div><div class="label">BPM</div></div>
 <div class="box"><div id="beat" class="big">·</div><div class="label">BEAT</div><div id="pulse" class="pulse"></div></div>
</section>
<div id="tapcount" class="tapcount">READY</div>
<div class="modebar">
 <button id="auto">▶ AUTO / LEARN</button>
 <button id="manual" class="manual">🔔 MANUAL COWBELL</button>
 <button id="random">🎲 RANDOM OFF</button>
</div>
<button id="sync" class="syncbig">⏱ TAP / SYNC</button>
<div class="hint">大きなTAP / SYNCでテンポ設定 ／ MANUAL COWBELLはいつでも自由に演奏</div>
<div class="controls">
 <div class="row"><label>音量</label><input id="volume" type="range" min="0" max="100" value="100"><output id="volumeO">100%</output></div>
 <div class="row"><label>同期微調整</label><input id="trim" type="range" min="-80" max="80" value="0"><output id="trimO">0ms</output></div>
</div>
<div id="status" class="status">AUTO / LEARNを押してから、曲の拍に合わせてTAP / SYNCを6〜8回。MANUAL COWBELLは同期とは無関係に自由に鳴らせます。</div>
<div class="foot">マイク不使用。TAP / SYNCは無音で同期、MANUAL COWBELLは純粋な演奏ボタンです。</div>
</main>
<script>
let ctx=null, learning=false, locked=false, randomMode=false;
let taps=[], bpm=0, nextBeat=0, beatNo=0, timer=0, pending=[];
const $=id=>document.getElementById(id);
$('volume').oninput=()=>$('volumeO').textContent=$('volume').value+'%';
$('trim').oninput=()=>$('trimO').textContent=(+$('trim').value>0?'+':'')+$('trim').value+'ms';

async function ensureAudio(){
 if(!ctx||ctx.state==='closed')ctx=new (window.AudioContext||window.webkitAudioContext)();
 if(ctx.state!=='running')try{await ctx.resume()}catch(e){}
}
function bell(t,g=1){
 const master=ctx.createGain(),bp=ctx.createBiquadFilter(),dry=ctx.createGain(),delay=ctx.createDelay(1),wet=ctx.createGain(),fb=ctx.createGain();
 bp.type='bandpass';bp.frequency.value=1050;bp.Q.value=1.4;dry.gain.value=1;delay.delayTime.value=.075;wet.gain.value=.18;fb.gain.value=.12;
 master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(Math.max(.001,+$('volume').value/100*.62*g),t+.004);master.gain.exponentialRampToValueAtTime(.0001,t+.12);
 master.connect(bp);bp.connect(dry).connect(ctx.destination);bp.connect(delay);delay.connect(wet).connect(ctx.destination);delay.connect(fb).connect(delay);
 [540,800].forEach((f,i)=>{let o=ctx.createOscillator(),og=ctx.createGain();o.type='square';o.frequency.value=f;og.gain.value=i?.65:1;o.connect(og).connect(master);o.start(t);o.stop(t+.14)});
}
function median(a){let b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]}
function calcTempo(){
 if(taps.length<3)return 0;
 let d=[];for(let i=1;i<taps.length;i++){let x=taps[i]-taps[i-1];if(x>.28&&x<1.2)d.push(x)}
 if(d.length<2)return 0;
 let m=median(d), clean=d.filter(x=>Math.abs(x-m)<m*.22);
 if(clean.length<2)clean=d;
 let avg=clean.reduce((a,b)=>a+b,0)/clean.length;
 return 60/avg;
}
function groove(n){
 let b=n%4;
 if(!randomMode)return (b===0||b===2)?[0]:[];
 if(b===2)return Math.random()<.82?[0]:[];
 if(b===0)return Math.random()<.32?[0]:[];
 if(b===1){let r=Math.random();return r<.08?[0]:r<.16?[.5]:[]}
 let r=Math.random();return r<.07?[0,.5]:r<.18?[.5]:r<.25?[0]:[];
}
function schedule(){
 if(!locked||!bpm)return;
 let now=ctx.currentTime,p=60/bpm;
 if(!nextBeat||nextBeat<now-.15)nextBeat=now+.02;
 while(nextBeat<now+.12){
   let n=beatNo++;
   let bt=nextBeat;
   setTimeout(()=>{$('beat').textContent=(n%4)+1;$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),75)},Math.max(0,(bt-now)*1000));
   groove(n).forEach(off=>pending.push({t:bt+p*off,g:(n%4===2)?1.08:.94}));
   nextBeat+=p;
 }
}
function commit(){
 if(!ctx)return;
 let now=ctx.currentTime,keep=[];
 for(let x of pending){
   if(x.t<=now+.025)bell(Math.max(now+.003,x.t+(+$('trim').value/1000)),x.g);else keep.push(x);
 }
 pending=keep;
}
function engine(){commit();schedule();timer=requestAnimationFrame(engine)}
function lockFromTaps(){
 let nb=calcTempo();if(!nb||nb<50||nb>210)return;
 bpm=nb;locked=true;
 // Last human tap is the current beat; next automatic beat follows one period later.
 nextBeat=taps[taps.length-1]+60/bpm;
 beatNo=1; pending=[];
 $('bpm').textContent=bpm.toFixed(1);
 $('tapcount').textContent='LOCK · '+taps.length+' TAPS';
 $('status').textContent='LOCK '+bpm.toFixed(1)+' BPM — 追加TAPで再同期できます';
}
$('auto').addEventListener('pointerdown',async()=>{
 await ensureAudio();
 learning=!learning;
 if(learning){
   taps=[];locked=false;pending=[];nextBeat=0;beatNo=0;
   $('auto').textContent='■ STOP';$('auto').classList.add('active');$('tapcount').textContent='TAP 0';
   $('status').textContent='曲の1拍ごとにTAP / SYNCを6〜8回ほど押してください（同期タップ自体は鳴りません）';
   if(!timer)engine();
 }else{
   locked=false;pending=[];$('auto').textContent='▶ AUTO / LEARN';$('auto').classList.remove('active');$('tapcount').textContent='READY';$('beat').textContent='·';
 }
},{passive:true});
$('sync').addEventListener('pointerdown',async()=>{
 await ensureAudio();let t=ctx.currentTime;
 if(!learning){$('status').textContent='まずAUTO / LEARNを押してください';return}
 // A long gap starts a fresh learning run.
 if(taps.length&&t-taps[taps.length-1]>1.5)taps=[];
 taps.push(t);if(taps.length>12)taps.shift();
 $('tapcount').textContent='TAP '+taps.length;
 $('beat').textContent='●';$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),75);
 if(taps.length>=4)lockFromTaps();
},{passive:true});

$('manual').addEventListener('pointerdown',async()=>{
 await ensureAudio();
 bell(ctx.currentTime+.004,1.2);
 $('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),75);
},{passive:true});

$('random').addEventListener('pointerdown',()=>{
 randomMode=!randomMode;$('random').textContent=randomMode?'🎲 RANDOM ON':'🎲 RANDOM OFF';$('random').classList.toggle('active',randomMode);
 $('status').textContent=randomMode?'RANDOM：3拍目中心＋時々裏拍/別拍/連打':'BASIC：1拍目・3拍目';
},{passive:true});
</script>
</body></html>
