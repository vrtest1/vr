<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Walkman 3D">
<meta name="theme-color" content="#0f0f12">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TPS-L2風 3Dビューアー</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
body{margin:0;background:#0f0f12;color:#eee;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;height:100dvh;overflow:hidden;display:flex;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wm-wrap{width:100%;height:100dvh;display:flex;flex-direction:column}
.topbar{width:100%;max-width:560px;align-self:center;display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;font-size:12px;letter-spacing:.1em;opacity:.9;flex:0 0 auto}
.top-right{display:flex;align-items:center;gap:8px}
#btn-lock,#btn-view{background:#1c1e26;color:#8a93a8;border:1px solid #333;border-radius:20px;padding:5px 10px;font-size:11px}
#btn-lock.on{background:#0f5c22;color:#b8ffc8;border-color:#1f7a33}
.pill{background:#222;color:#aaa;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
.pill.play{background:#b87a00;color:#fff4d6}
.stage{flex:1 1 auto;position:relative;min-height:0;touch-action:none}
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.2em;color:#667}
.ctrl{width:100%;max-width:560px;align-self:center;flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.ctrl button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;flex:1;background:#1c1e26;color:#ddd;border:1px solid #333;border-radius:10px;padding:13px 0;font-size:15px}
.ctrl .sq{display:inline-block;width:.8em;height:.8em;background:currentColor;border-radius:1px;vertical-align:-.04em}   /* ■ glyph is tiny; match the ▶ marks */
.ctrl .ej{display:inline-block;position:relative;width:.9em;height:.8em;vertical-align:-.04em}   /* ⏏ likewise */
.ctrl .ej::before,.ctrl .ej::after{content:"";position:absolute;left:0;right:0;background:currentColor}
.ctrl .ej::before{top:0;height:.52em;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ctrl .ej::after{bottom:0;height:.16em;border-radius:1px}
.ctrl button.on{background:#36568f;color:#fff}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<body>
<div class="wm-wrap">
<div class="topbar"><span>TPS-L2風 3D</span><span class="top-right"><button id="btn-view">⟲ 正面</button><button id="btn-lock" aria-pressed="false">☾ OFF</button><span id="stat" class="pill">STOP</span></span></div>
<div class="stage" id="stage"><div id="loading">LOADING…</div></div>
<div class="ctrl">
<button id="k-rew">◀◀</button>
<button id="k-play">▶</button>
<button id="k-ff">▶▶</button>
<button id="k-stop" aria-label="停止"><span class="sq"></span></button>
<button id="k-eject" aria-pressed="false" aria-label="取り出し"><span class="ej"></span></button>
</div>
<video id="nosleep" loop muted playsinline preload="auto" src="silent.mp4" style="position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;bottom:0;left:0"></video>
</div>
<script>
/* iOS Safari ignores user-scalable=no: block page pinch / double-tap zoom so only the 3D view zooms */
(() => {
  const stop = (e) => e.preventDefault();
  for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, stop, { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
})();
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- transport state (same model as the 2D version) ---------- */
const stat = document.getElementById('stat');
let playing = false, speedMul = 1, pos = 0, tapeSide = 'A';
let flipU = null;   // turning the cassette over: null = idle, else 0..1 progress
const keyEl = { rew: 'k-rew', play: 'k-play', ff: 'k-ff', stop: 'k-stop' };
function mode() { return !playing ? 'stop' : speedMul > 1 ? 'ff' : speedMul < -1 ? 'rew' : 'play'; }
function setStat() {
  const m = mode();
  const label = { stop: 'STOP', play: 'PLAY ▶', ff: 'FF ▶▶', rew: 'REW ◀◀' }[m] + (turbo && (m === 'ff' || m === 'rew') ? ' ×10' : '');
  stat.textContent = (lidTarget && !playing ? 'OPEN ⏏' : label) + ' · ' + tapeSide;
  stat.classList.toggle('play', playing);
  for (const [k, id] of Object.entries(keyEl)) document.getElementById(id).classList.toggle('on', k === m);
  ejectBtn.classList.toggle('on', lidTarget === 1);
  ejectBtn.setAttribute('aria-pressed', lidTarget === 1);
  if (m === 'stop') stopTapAt = performance.now();
}
let stopTapAt = 0;
/* lid: 0 = closed, 1 = open. Transport keys while open close the lid first, then start. */
const ejectBtn = document.getElementById('k-eject');
let lidTarget = 0, lidU = 0, pendingMul = null;
function start(mul) {
  if (flipU !== null) return;   // wait until the cassette is back in
  if (lidTarget || lidU > 0) { pendingMul = mul; lidTarget = 0; setStat(); return; }
  playing = true; speedMul = mul; setStat();
}
document.getElementById('k-play').onclick = () => start(1);
document.getElementById('k-ff').onclick = () => start(6);
document.getElementById('k-rew').onclick = () => start(-6);
// holding FF / REW winds at turbo speed until released, then carries on at normal speed
let turbo = false;
for (const [id, mul] of [['k-ff', 6], ['k-rew', -6]]) {
  const el = document.getElementById(id);
  let holdTimer = null;
  const release = () => {
    clearTimeout(holdTimer); holdTimer = null;
    if (turbo) { turbo = false; setStat(); }
  };
  el.addEventListener('pointerdown', () => {
    holdTimer = setTimeout(() => { start(mul); turbo = true; setStat(); }, 400);
  });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(t, release);
  el.addEventListener('contextmenu', (e) => e.preventDefault());   // no long-press menu on phones
}
document.getElementById('k-stop').onclick = () => { playing = false; speedMul = 1; pendingMul = null; setStat(); };
ejectBtn.onclick = () => {
  if (flipU !== null) return;
  pendingMul = null;
  if (lidTarget === 0) { playing = false; speedMul = 1; lidTarget = 1; }   // STOP/EJECT
  else lidTarget = 0;
  setStat();
};
setStat();

/* ---------- keep the screen awake ---------- */
let wakeLock = null, wantLock = false;
const lockBtn = document.getElementById('btn-lock');
const nosleep = document.getElementById('nosleep');
async function videoOn() { try { nosleep.muted = true; nosleep.setAttribute('muted', ''); await nosleep.play(); } catch (e) {} }
function videoOff() { try { nosleep.pause(); } catch (e) {} }
async function applyLock() {
  const native = 'wakeLock' in navigator;
  try {
    if (wantLock) {
      if (native) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; } }
      await videoOn();
    } else {
      if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
      videoOff();
    }
  } catch (e) {}
  lockBtn.textContent = wantLock ? '☀ ON' : '☾ OFF';
  lockBtn.classList.toggle('on', wantLock);
  lockBtn.setAttribute('aria-pressed', wantLock);
}
lockBtn.onclick = async () => { wantLock = !wantLock; await applyLock(); };
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wantLock) {
    if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
    await videoOn();
  }
});

/* ---------- 3D scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f12);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(0.3, 0.6, 1);
scene.add(key);

const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.15;
controls.maxPolarAngle = Math.PI * 0.85;

// walkman size (m): width incl. the side keys, height incl. the top button, depth
const MODEL_W = 0.092, MODEL_H = 0.1355, MODEL_D = 0.029, FIT_MARGIN = 1.03;
function frontDistance() {
  // fit the front face (the part nearest the camera) to the stage as tightly as possible
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const dH = (MODEL_H / 2) / t;
  const dW = (MODEL_W / 2) / (t * camera.aspect);
  return Math.max(dH, dW) * FIT_MARGIN + MODEL_D / 2;
}
// pinch / wheel zoom from close-up detail out to the screen-filling fit
let userMoved = false;
controls.addEventListener('start', () => { userMoved = true; });
function resetView() {
  const d = frontDistance();
  controls.target.set(0, 0, 0);
  camera.position.set(0, 0, d);
  controls.minDistance = d * 0.35;
  controls.maxDistance = d;   // fully zoomed out = fits the screen exactly
  controls.update();
  userMoved = false;
}
document.getElementById('btn-view').onclick = resetView;
let ready = false, lastW = 0, lastH = 0;
// Match the drawing buffer and camera aspect to the canvas' actual on-screen size.
// Checked every frame: iOS Safari can report a stale stage height at startup and
// while its toolbars collapse, which otherwise leaves the image squeezed.
function syncSize() {
  const c = renderer.domElement;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h || (w === lastW && h === lastH)) return;
  lastW = w; lastH = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!ready || flipU !== null) return;   // the flip animation drives the camera itself
  if (!userMoved) resetView();   // keep the fit on rotation / toolbar changes until the user moves the view
  else { const d = frontDistance(); controls.minDistance = d * 0.35; controls.maxDistance = d; }
}
syncSize();

const loader = new GLTFLoader();
const [wGltf, cGltf] = await Promise.all([loader.loadAsync('walkman.glb'), loader.loadAsync('sony_cassette.glb')]);
document.getElementById('loading').remove();

const walkman = wGltf.scene, cassette = cGltf.scene;
// glTF has the walkman lying face-up (+Y); stand it up facing the camera (+Z)
const holder = new THREE.Group();
holder.rotation.x = Math.PI / 2;
holder.add(walkman);
scene.add(holder);
// the cassette tilts out about its front long edge on the door-hinge side,
// so it swings away from the body wall instead of into it
const CAS_HINGE_Y = 0.0125, CAS_HINGE_Z = -0.0319;
const casPivot = new THREE.Group();
casPivot.position.set(0, CAS_HINGE_Y, CAS_HINGE_Z);
// casMove slides the cassette out sideways (+z = toward the heads = screen right);
// casFlip turns it over about that same axis, through the middle of its thickness
const CAS_MID_Y = 0.006;
const casMove = new THREE.Group(), casFlip = new THREE.Group();
casMove.position.set(0, -CAS_HINGE_Y, -CAS_HINGE_Z);
casFlip.position.set(0, CAS_MID_Y, 0);
cassette.position.set(0, -CAS_MID_Y, 0);
casPivot.add(casMove); casMove.add(casFlip); casFlip.add(cassette);
walkman.getObjectByName('CassetteSlot').add(casPivot);
// centre the device
holder.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(walkman.getObjectByName('Body'));
holder.position.sub(box.getCenter(new THREE.Vector3()));

// translucent parts: shell first, smoked door glass on top
walkman.traverse((o) => { if (o.isMesh && o.material.transparent) { o.material.depthWrite = false; o.renderOrder = 2; } });
cassette.traverse((o) => { if (o.isMesh && o.material.transparent) { o.material.depthWrite = false; o.renderOrder = 1; } });

// reels: on side A the cassette's Reel_R sits on top (take-up) and Reel_L at the bottom
// (supply); turning the cassette over to side B swaps them
function tapePack(reel) {
  let pack = null;
  reel.traverse((o) => { if (o.isMesh && o.material.name === 'CS_Tape') pack = o; });
  return pack;
}
const reelR = cassette.getObjectByName('Reel_R'), reelL = cassette.getObjectByName('Reel_L');
const packOf = new Map([[reelR, tapePack(reelR)], [reelL, tapePack(reelL)]]);
const packTop = packOf.get(reelR);
const topReel = () => (tapeSide === 'A' ? reelR : reelL), botReel = () => (tapeSide === 'A' ? reelL : reelR);
const spTop = walkman.getObjectByName('Spindle_Top'), spBot = walkman.getObjectByName('Spindle_Bottom');

// tape running from each pack to its guide roller, redrawn every frame so it always leaves
// the pack tangentially at its current radius (cassette space: x along, y height, z to the heads)
const TAPE_Y0 = 0.0041, TAPE_Y1 = 0.0079, ROLLER_X = 0.036 + 0.00202, ROLLER_Z = 0.0255;
function tapeSpan(reel, side) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12), 3));
  g.setIndex([0, 1, 2, 1, 3, 2]);
  const mesh = new THREE.Mesh(g, packTop.material);
  mesh.frustumCulled = false;
  cassette.add(mesh);
  return { g, reel, side, qx: side * ROLLER_X };
}
// each span belongs to one reel and its roller (fixed in cassette space, so it flips with it)
const spanOf = new Map([[reelR, tapeSpan(reelR, 1)], [reelL, tapeSpan(reelL, -1)]]);
function updateSpan(s, rCm) {
  const cx = s.reel.position.x, cz = s.reel.position.z, r = rCm / 100;
  const dx = s.qx - cx, dz = ROLLER_Z - cz, d = Math.hypot(dx, dz);
  const base = Math.atan2(dz, dx), a = Math.acos(Math.min(1, r / d));
  // of the two tangent points take the one on the cassette's outer side
  const t1 = base + a, t2 = base - a;
  const t = s.side * Math.cos(t1) > s.side * Math.cos(t2) ? t1 : t2;
  const tx = cx + r * Math.cos(t), tz = cz + r * Math.sin(t);
  const p = s.g.attributes.position;
  p.setXYZ(0, tx, TAPE_Y0, tz); p.setXYZ(1, tx, TAPE_Y1, tz);
  p.setXYZ(2, s.qx, TAPE_Y0, ROLLER_Z); p.setXYZ(3, s.qx, TAPE_Y1, ROLLER_Z);
  p.needsUpdate = true;
  s.g.computeVertexNormals();
}

// side keys latch while their mode is active; STOP springs back.
// The marks match the real unit: PLAY ▲ and ▲▲ point up the device, so the top key
// (node Key_Rew) is fast-forward and the middle one (node Key_FF) is rewind.
const keys = {};
for (const [mode, node] of [['rew', 'FF'], ['play', 'Play'], ['ff', 'Rew'], ['stop', 'Stop']]) {
  const o = walkman.getObjectByName('Key_' + node);
  keys[mode] = { o, x0: o.position.x, d: 0 };
}

const door = walkman.getObjectByName('Door');   // hinged on its long left edge, opens about Z

// OPERATION lamp: glows while the tape runs (PLAY / FF / REW), dark red otherwise
let ledMat = null;
walkman.traverse((o) => { if (o.isMesh && o.material.name === 'WM_LEDRed') ledMat = o.material; });
const LED_ON = new THREE.Color(0.5, 0, 0.005), LED_OFF = new THREE.Color(0.1, 0, 0.002);
// skip tone mapping so the bright lamp stays pure red instead of drifting to orange
if (ledMat) ledMat.toneMapped = false;
let ledLit = null;
function updateLed() {
  if (!ledMat || ledLit === playing) return;
  ledLit = playing;
  ledMat.color.copy(playing ? LED_ON : LED_OFF);
  ledMat.emissive.setRGB(1, 0, 0.01);
  ledMat.emissiveIntensity = playing ? 0.85 : 0;
}

lastW = lastH = 0; syncSize();   // re-measure after loading
resetView();
ready = true;

/* ---------- animation ---------- */
const DOOR_OPEN = THREE.MathUtils.degToRad(35), CAS_TILT = THREE.MathUtils.degToRad(-14), CAS_LIFT = 0.0025;
const LID_TIME = 1.3;   // seconds for the full open (or close) sequence
const ease = (x) => { x = THREE.MathUtils.clamp(x, 0, 1); return x * x * (3 - 2 * x); };
function updateLid(dt) {
  const step = dt / LID_TIME;
  lidU = lidTarget ? Math.min(1, lidU + step) : Math.max(0, lidU - step);
  // opening: door first, then the cassette slides out; closing runs the same timeline backwards
  const d = ease(lidU / 0.55), c = ease((lidU - 0.5) / 0.5);
  door.rotation.z = DOOR_OPEN * d;
  casPivot.rotation.x = CAS_TILT * c;
  casPivot.position.y = CAS_HINGE_Y + CAS_LIFT * c;
  if (lidU === 0 && pendingMul !== null) { const m = pendingMul; pendingMul = null; start(m); }
}
/* turning the tape over: with the lid fully open, click the cassette. It slides out to the
   right (clear of the body), turns over about that sideways axis and slides back in. */
const FLIP_TIME = 2.6, FLIP_PULL = 0.095, FLIP_LIFT = 0.003;
const FLIP_SHIFT = 0.034, FLIP_ZOOM = 0.75;   // camera follows so the pulled-out tape stays in view
let flipBase = 0, flipCam = null;
function startFlip() {
  if (flipU !== null || lidTarget !== 1 || lidU < 1) return;
  flipU = 0;
  flipBase = casFlip.rotation.z;
  // the reel on top becomes the bottom one: the tape on it is now what is left to play
  tapeSide = tapeSide === 'A' ? 'B' : 'A';
  pos = 1 - pos;
  flipCam = { target: controls.target.clone(), off: camera.position.clone().sub(controls.target) };
  controls.enabled = false;
  controls.maxDistance = Infinity;
  setStat();
}
function updateFlip(dt) {
  if (flipU === null) return;
  flipU = Math.min(1, flipU + dt / FLIP_TIME);
  const out = ease(flipU / 0.35) * (1 - ease((flipU - 0.65) / 0.35));
  casMove.position.z = -CAS_HINGE_Z + FLIP_PULL * out;
  casMove.position.y = -CAS_HINGE_Y + FLIP_LIFT * out;
  casFlip.rotation.z = flipBase + Math.PI * ease((flipU - 0.3) / 0.4);
  controls.target.copy(flipCam.target).x += FLIP_SHIFT * out;
  camera.position.copy(flipCam.off).multiplyScalar(1 + FLIP_ZOOM * out).add(controls.target);
  if (flipU === 1) {
    flipU = null;
    casFlip.rotation.z = (flipBase + Math.PI) % (2 * Math.PI);
    controls.target.copy(flipCam.target);
    camera.position.copy(flipCam.off).add(flipCam.target);
    controls.enabled = true;
    lastW = lastH = 0; syncSize();   // pick up any resize skipped during the flip
    controls.maxDistance = frontDistance();
    setStat();
  }
}
// a click (not a drag) on the cassette while the lid is open
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  downAt = null;
  if (flipU !== null || lidTarget !== 1 || lidU < 1) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.intersectObject(cassette, true).length) startFlip();
});
let angTop = 0, angBot = 0, lastT = performance.now();
/* tape transport (cm, s). C60: 30 min a side at 4.76 cm/s. pos = fraction of the side on the
   take-up (top) reel. Each pack's radius follows from its wound length (constant tape area):
   r = sqrt(r0^2 + len * thickness / pi), so the take-up reel grows fast at first, then slows. */
const TAPE_V = 4.76, SIDE_SEC = 30 * 60, TAPE_LEN = TAPE_V * SIDE_SEC;
const WIND_SPEED = SIDE_SEC / 150;   // FF / REW: a whole side in 2 min 30 s, as on the TPS-L2 (12x play speed)
const TURBO = 10;   // FF / REW held down: 10x faster still (a side in 15 s)
const MAX_SPIN =2.2 * 2 * Math.PI;   // drawn reel spin limit (rad/s): under 30°/frame even at ~30 fps
// The emptiest pack stays a little wider than the 1.1 cm hub so their sides never coincide
// (that z-fought as black/white stripes); a full side fills a pack out to 2.4 cm.
const PACK_MIN = 1.13, PACK_MAX = 2.4;
const TAPE_K = (PACK_MAX ** 2 - PACK_MIN ** 2) / TAPE_LEN;   // thickness / pi (≈ 17 µm tape)
const packR = (len) => Math.sqrt(PACK_MIN ** 2 + TAPE_K * len);
const packTopR = (p) => packR(p * TAPE_LEN), packBotR = (p) => packR((1 - p) * TAPE_LEN);
// leader: one turn of the 1.1 cm hub, after which the brown tape starts to show
const LEADER = (2 * Math.PI * 1.1) / TAPE_LEN;
// The pack is a ring hugging the 11 mm hub. Only its outer wall moves; scaling the whole mesh
// would also widen the inner hole and open a gap between the tape and the hub.
const HUB_R = 0.011;
function setPackRadius(pack, r) {
  const p = pack.geometry.attributes.position;
  if (!pack.userData.base) {   // pack is centred on the reel origin, local Y = reel axis
    pack.userData.base = Float32Array.from(p.array);
    pack.userData.lastR = -1;
  }
  if (pack.userData.lastR === r) return;
  pack.userData.lastR = r;
  const b = pack.userData.base, R = r / 100;
  for (let i = 0; i < p.count; i++) {
    const x = b[3 * i], z = b[3 * i + 2], d = Math.hypot(x, z);
    if (d < HUB_R + 0.0005) continue;           // inner wall stays on the hub
    p.setXYZ(i, x * R / d, b[3 * i + 1], z * R / d);
  }
  p.needsUpdate = true;
  pack.geometry.computeBoundingSphere();
}
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (playing) {
    // tape speed (cm/s, + = toward the top reel)
    const v = TAPE_V * (Math.abs(speedMul) > 1 ? WIND_SPEED * (turbo ? TURBO : 1) : 1) * Math.sign(speedMul);
    pos += (v * dt) / TAPE_LEN;
    if (pos >= 1) { pos = 1; playing = false; speedMul = 1; setStat(); }
    if (pos <= 0) { pos = 0; playing = false; speedMul = 1; setStat(); }
    // each reel turns at tape speed / its own pack radius; counter-clockwise from the front while playing
    let dTop = (v / packTopR(pos)) * dt, dBot = (v / packBotR(pos)) * dt;
    // FF / REW spin the reels at 10+ rev/s, which at 60 fps strobes (the 60°-symmetric hubs
    // look stopped or turning backwards). Cap the drawn spin, keeping the two reels' ratio.
    const lim = MAX_SPIN * dt, worst = Math.max(Math.abs(dTop), Math.abs(dBot));
    if (worst > lim) { dTop *= lim / worst; dBot *= lim / worst; }
    angTop += dTop; angBot += dBot;
    // a turned-over cassette has its reel axes reversed, so its hubs turn the other way locally
    const s = tapeSide === 'A' ? 1 : -1;
    topReel().rotation.y += dTop * s;
    botReel().rotation.y += dBot * s;
  }
  updateLid(dt);
  updateFlip(dt);
  updateLed();
  const rTop = packTopR(pos), rBot = packBotR(pos);
  const pTop = packOf.get(topReel()), pBot = packOf.get(botReel());
  setPackRadius(pTop, rTop);
  setPackRadius(pBot, rBot);
  // an (almost) empty reel shows just its white hub; the brown tape appears once the
  // leader has wound on (and vanishes from the supply reel at the very end)
  pTop.visible = pos > LEADER;
  pBot.visible = pos < 1 - LEADER;
  updateSpan(spanOf.get(topReel()), rTop);
  updateSpan(spanOf.get(botReel()), rBot);
  spTop.rotation.y = angTop;
  spBot.rotation.y = angBot;

  const m = mode();
  const stopHeld = now - stopTapAt < 160;
  for (const [name, k] of Object.entries(keys)) {
    const down = name === 'stop' ? stopHeld : name === m;
    k.d += ((down ? 0.0028 : 0) - k.d) * Math.min(1, dt * 20);
    k.o.position.x = k.x0 - k.d;
  }
  syncSize();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
