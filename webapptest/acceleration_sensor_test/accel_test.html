<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1kHzサイン波ビブラートプレイヤー</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #1a2a6c, #2a5298);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        #btn_permission {
            background: #2196F3;
        }
        #btn_permission:hover {
            background: #0b7dda;
        }
        .status-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-size: 1.1rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sensor-data {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .data-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            flex: 1;
            margin: 5px;
            min-width: 120px;
        }
        .data-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 5px;
            color: #4CAF50;
        }
        .instructions {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            line-height: 1.6;
        }
        .instructions h3 {
            margin-top: 0;
            color: #FFD700;
        }
        .vibrato-info {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .vibrato-item {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid #FFD700;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            flex: 1;
            margin: 0 10px;
        }
        @media (max-width: 600px) {
            .sensor-data, .vibrato-info {
                flex-direction: column;
            }
            .data-item, .vibrato-item {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>1kHzサイン波ビブラートプレイヤー</h1>
        
        <div class="control-panel">
            <button id="btn_permission">加速度センサーを許可する</button>
            <button id="btn_start" disabled>音を開始</button>
            <button id="btn_stop" disabled>音を停止</button>
        </div>
        
        <div class="status-box" id="status">
            最初に「加速度センサーを許可する」を押してください
        </div>
        
        <div class="sensor-data">
            <div class="data-item">
                動きの強さ
                <div class="data-value" id="strength">0.00</div>
            </div>
            <div class="data-item">
                現在の周波数
                <div class="data-value" id="current_freq">1000 Hz</div>
            </div>
            <div class="data-item">
                ビブラート深さ
                <div class="data-value" id="vibrato_depth">0.00</div>
            </div>
        </div>
        
        <div class="vibrato-info">
            <div class="vibrato-item">
                <strong>1kHzサイン波</strong><br>
                -12dBの1kHzサイン波にビブラート効果を適用
            </div>
            <div class="vibrato-item">
                <strong>操作ガイド</strong><br>
                1. センサー許可 → 2. 音を開始
            </div>
        </div>
        
        <div class="instructions">
            <h3>使い方</h3>
            <p>1. 「加速度センサーを許可する」ボタンでセンサーアクセスを許可</p>
            <p>2. 「音を開始」ボタンで1kHzサイン波を再生</p>
            <p>3. スマホを揺らすと音程が変化（動きが強いほど変化幅が大きい）</p>
            <p>4. 「音を停止」ボタンでサウンドをオフ</p>
        </div>
    </div>

    <script>
        // 要素の取得
        const btnPermission = document.getElementById('btn_permission');
        const btnStart = document.getElementById('btn_start');
        const btnStop = document.getElementById('btn_stop');
        const status = document.getElementById('status');
        const strengthDisplay = document.getElementById('strength');
        const currentFreqDisplay = document.getElementById('current_freq');
        const vibratoDepthDisplay = document.getElementById('vibrato_depth');
        
        // オーディオ関連の変数
        let audioContext;
        let mainOscillator;
        let gainNode;
        let lfoOscillator;
        let lfoGain;
        let isPlaying = false;
        
        // センサー関連の変数
        let x_offset = 0, y_offset = 0, z_offset = 0;
        let strength = 0;
        let isCalibrated = false;
        let sensorListenerActive = false;
        
        // センサー許可（iOS用）
        btnPermission.addEventListener('click', () => {
            if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            status.textContent = 'センサー利用が許可されました。次に「音を開始」を押してください';
                            btnStart.disabled = false;
                            
                            if (!sensorListenerActive) {
                                startSensor();
                                sensorListenerActive = true;
                            }
                        } else {
                            status.textContent = 'センサー利用が許可されませんでした';
                        }
                    })
                    .catch(error => {
                        status.textContent = 'エラー: ' + error.message;
                    });
            } else {
                status.textContent = 'このデバイスは加速度センサーを直接サポートしています';
                btnStart.disabled = false;
                
                if (!sensorListenerActive) {
                    startSensor();
                    sensorListenerActive = true;
                }
            }
        });
        
        // 音の開始
        btnStart.addEventListener('click', () => {
            if (!isPlaying) {
                // オーディオコンテキストの作成
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // メインオシレーターの作成 (1kHz)
                mainOscillator = audioContext.createOscillator();
                mainOscillator.type = 'sine';
                mainOscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
                
                // ゲインノードの作成 (-12dB ≈ 0.2512)
                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.2512;
                
                // LFOオシレーターの作成 (ビブラート用)
                lfoOscillator = audioContext.createOscillator();
                lfoOscillator.type = 'sine';
                lfoOscillator.frequency.value = 5; // 5Hz固定
                
                // LFOゲインノード (ビブラートの深さ)
                lfoGain = audioContext.createGain();
                lfoGain.gain.value = 0;
                
                // オーディオチェーンの接続
                lfoOscillator.connect(lfoGain);
                lfoGain.connect(mainOscillator.frequency);
                mainOscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // オシレーターの開始
                mainOscillator.start();
                lfoOscillator.start();
                
                status.textContent = '再生中... スマホを揺らすと音程が変化します';
                btnStart.textContent = '再生中';
                btnStop.disabled = false;
                isPlaying = true;
            }
        });
        
        // 音の停止
        btnStop.addEventListener('click', () => {
            if (isPlaying) {
                mainOscillator.stop();
                lfoOscillator.stop();
                btnStart.textContent = '音を開始';
                status.textContent = '停止中';
                btnStop.disabled = true;
                isPlaying = false;
                
                // リソース解放
                audioContext.close();
            }
        });
        
        // センサーの開始
        function startSensor() {
            window.addEventListener('devicemotion', handleMotion);
            status.textContent += ' センサー監視を開始しました';
        }
        
        // モーション処理
        function handleMotion(event) {
            // 初回のみキャリブレーション
            if (!isCalibrated) {
                x_offset = event.accelerationIncludingGravity.x;
                y_offset = event.accelerationIncludingGravity.y;
                z_offset = event.accelerationIncludingGravity.z;
                isCalibrated = true;
                status.textContent = 'キャリブレーション完了。音を開始してください';
                return;
            }
            
            // オフセットを引いて重力の影響を除去
            const x = event.accelerationIncludingGravity.x - x_offset;
            const y = event.accelerationIncludingGravity.y - y_offset;
            const z = event.accelerationIncludingGravity.z - z_offset;
            
            // 動きの強さを計算
            strength = Math.sqrt(x*x + y*y + z*z);
            strengthDisplay.textContent = strength.toFixed(2);
            
            // 再生中のみビブラート効果を適用
            if (isPlaying && lfoGain) {
                // ビブラートの深さを計算 (0～50Hzの範囲)
                const vibratoDepth = Math.min(strength * 10, 50);
                vibratoDepthDisplay.textContent = vibratoDepth.toFixed(2);
                
                // ビブラート効果の適用
                lfoGain.gain.value = vibratoDepth;
                
                // 現在の周波数を表示 (中心値1000Hz ± ビブラート深さ)
                currentFreqDisplay.textContent = `1000 ± ${vibratoDepth.toFixed(0)} Hz`;
            }
        }
    </script>
</body>
</html>
