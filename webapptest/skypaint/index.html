<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1220">
<title>Sky Cloud MR</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#080d17;color:#f4f7ff;min-height:100svh}header{padding:12px 16px 8px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.sub{font-size:11px;color:#aebbd0;font-weight:400}.stage{position:relative;width:100vw;height:min(72svh,760px);background:#101b2a;overflow:hidden;touch-action:none}video,#fx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#fx{pointer-events:auto;touch-action:none}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#b8c6db;padding:24px;pointer-events:none}.controls{padding:12px 14px max(15px,env(safe-area-inset-bottom));display:grid;gap:10px}.row{display:flex;gap:8px;align-items:center}.row button{border:1px solid #33435b;background:#182438;color:white;border-radius:12px;padding:11px 12px;font-size:14px;flex:1}.row button.active{background:#1778d2;border-color:#65baff}.row button.primary{background:#1477d4;border-color:#53a8f5}.row button:disabled{opacity:.45}.status{font-size:12px;color:#aebbd0;min-height:18px}.slider{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12px;color:#cad5e4}.slider input{width:100%}.hint{font-size:11px;color:#93a2b8;line-height:1.4}.badge{font-size:10px;color:#95a8c4}
</style>
</head>
<body>
<header><div>☁️ Sky Cloud MR<div class="sub">曇り空にも対応する空セグメンテーションデモ</div></div><span id="mode" class="badge">カメラ未開始</span></header>
<div class="stage" id="stage"><video id="video" autoplay playsinline muted></video><canvas id="fx"></canvas><div class="empty" id="empty">カメラを開始してください<br><small>屋外の空に向けると空色を自動判定します</small></div></div>
<div class="controls">
 <div class="row"><button class="primary" id="start">カメラ開始</button><button id="stop" disabled>停止</button><button id="track">向き追従OFF</button></div><div class="row"><button id="clear">リセット</button></div>
 <div class="row"><button class="active" data-tool="cloud">雲を描く</button><button data-tool="erase">雲を消す</button><button data-tool="inspect">空マスク確認</button></div>
 <div class="slider"><span>雲ブラシ</span><input id="brush" type="range" min="18" max="150" value="72"><span id="brushN">72</span></div>
 <div class="row"><button class="active" data-style="fair">白い雲</button><button data-style="storm">雨雲（暗め）</button></div>
 <div class="slider"><span>雲の濃さ</span><input id="opacity" type="range" min="20" max="100" value="78"><span id="opacityN">78%</span></div>
 <div class="status" id="status">準備完了。まずカメラを開始してください。</div>
 <div class="hint">カメラ開始後に「向き追従」をONにすると、端末の向きに合わせて雲が動きます。位置追跡ではないため移動には対応しません。画面をなぞって操作します。空判定モデルを初回にネットから読み込みます（約数十MB）。映像の推論は端末内で行います。曇天にも対応しますが、枝など細い境界は誤ることがあります。SafariではHTTPSのページで開いてください。</div>
</div>
<script>
(()=>{
const video=document.querySelector('#video'), canvas=document.querySelector('#fx'), ctx=canvas.getContext('2d',{alpha:true}), stage=document.querySelector('#stage'), empty=document.querySelector('#empty'), status=document.querySelector('#status'), mode=document.querySelector('#mode');
const work=document.createElement('canvas'), wc=work.getContext('2d',{willReadFrequently:true}), maskCanvas=document.createElement('canvas'), maskCtx=maskCanvas.getContext('2d'); let stream=null, raf=0, tool='cloud', cloudStyle='fair', painting=false, last=null, clouds=[], mask=null, maskW=0,maskH=0, frame=0, inspect=false, segmenter=null, inferenceBusy=false, tracking=false, orientBase=null, orientDelta={yaw:0,pitch:0};
const resize=()=>{const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';};new ResizeObserver(resize).observe(stage);resize();
async function detectSky(){if(!segmenter||inferenceBusy||video.readyState<2)return;inferenceBusy=true;try{const w=384,h=Math.max(160,Math.round(w*video.videoHeight/video.videoWidth));if(work.width!==w||work.height!==h){work.width=w;work.height=h}wc.drawImage(video,0,0,w,h);const result=await segmenter(work);if(!Array.isArray(result))throw new Error('モデル出力が配列ではありません');const sky=result.find(x=>String(x.label).toLowerCase()==='sky');if(!sky?.mask){inferenceBusy=false;return}const m=sky.mask, mw=m.width||m.cols||144,mh=m.height||m.rows||96,src=m.data;if(!src){inferenceBusy=false;return}maskW=mw;maskH=mh;if(!mask||mask.length!==mw*mh)mask=new Uint8Array(mw*mh);for(let i=0;i<mask.length;i++){const v=src.length===mask.length?src[i]:src[i*4];const next=v>125?255:0;mask[i]=next?Math.min(255,mask[i]+100):Math.max(0,mask[i]-100)}mode.textContent='空を認識中';}catch(e){status.textContent='空認識エラー: '+(e?.message||String(e)).slice(0,160);console.error('Sky segmentation failed:',e);}finally{inferenceBusy=false}}

function cloudStamp(x,y,size,alpha,style){const d=canvas.width/Math.max(1,stage.clientWidth),s=size*d;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x*d,y*d);
// Stamp-specific deterministic randomness keeps adjacent dabs from making a repeated scallop pattern.
let seed=(Math.floor(x*17+3)*73856093 ^ Math.floor(y*19+5)*19349663)>>>0;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const palette=style==='storm'?{core:'rgba(76,86,101,.60)',mid:'rgba(50,60,74,.55)',edge:'rgba(30,39,52,0)',light:'rgba(148,158,170,.32)'}:{core:'rgba(255,255,255,.72)',mid:'rgba(248,251,255,.62)',edge:'rgba(232,241,252,0)',light:'rgba(255,255,255,.55)'};
// Soft broad body under the puffs.
let body=ctx.createRadialGradient(0,-s*.06,s*.08,0,0,s*.57);body.addColorStop(0,palette.core);body.addColorStop(.58,palette.mid);body.addColorStop(1,palette.edge);ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,s*.52,s*.30,0,0,Math.PI*2);ctx.fill();
// Uneven large and small lobes create a fluffy silhouette instead of identical round stamps.
for(let i=0;i<19;i++){const px=(rnd()-.5)*s*.92,py=(rnd()-.5)*s*.40-s*.04,rx=s*(.075+rnd()*.19),ry=rx*(.48+rnd()*.64);let g=ctx.createRadialGradient(px-rx*.18,py-ry*.30,rx*.04,px,py,rx*1.15);g.addColorStop(0,palette.light);g.addColorStop(.34,palette.core);g.addColorStop(.72,palette.mid);g.addColorStop(1,palette.edge);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(px,py,rx,ry,rnd()*.22,0,Math.PI*2);ctx.fill();}
// Fine wisps soften the lower edge.
for(let i=0;i<9;i++){const px=(rnd()-.5)*s*.82,py=s*(.13+rnd()*.11),rx=s*(.045+rnd()*.10),ry=rx*(.25+rnd()*.35);const g=ctx.createRadialGradient(px,py,0,px,py,rx);g.addColorStop(0,palette.mid);g.addColorStop(1,palette.edge);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(px,py,rx,ry,0,0,Math.PI*2);ctx.fill();}
ctx.restore();}
function draw(){raf=requestAnimationFrame(draw);if(++frame%30===0)detectSky();let cw=canvas.width,ch=canvas.height;ctx.clearRect(0,0,cw,ch);if(!mask||!mask.length)return;
// Create soft sky alpha mask in output dimensions.
const mw=maskW,mh=maskH;let data=ctx.createImageData(mw,mh);for(let i=0;i<mask.length;i++){let a=mask[i];data.data[i*4]=255;data.data[i*4+1]=255;data.data[i*4+2]=255;data.data[i*4+3]=a}maskCanvas.width=mw;maskCanvas.height=mh;maskCtx.putImageData(data,0,0);const mc=maskCanvas;
if(inspect){ctx.save();ctx.globalAlpha=.38;ctx.drawImage(mc,0,0,cw,ch);ctx.restore();}
// Clouds are stored in normalized video-view coordinates. Clip painting to detected sky.
ctx.save();ctx.globalCompositeOperation='destination-in';ctx.drawImage(mc,0,0,cw,ch);ctx.restore();
for(const c of clouds)if(c.points?.length){for(const p of c.points){const nx=p.x-orientDelta.yaw/60,ny=p.y+orientDelta.pitch/45;if(nx>=-.4&&nx<=1.4&&ny>=-.4&&ny<=1.4)cloudStamp(nx*stage.clientWidth,ny*stage.clientHeight,c.size,c.alpha,c.style)}}
// Build clipping mask again: destination-in above was on an empty canvas; clouds have already been drawn after it.
if(clouds.length){const layer=document.createElement('canvas');layer.width=cw;layer.height=ch;let l=layer.getContext('2d');l.drawImage(canvas,0,0);l.globalCompositeOperation='destination-in';l.drawImage(mc,0,0,cw,ch);ctx.clearRect(0,0,cw,ch);ctx.drawImage(layer,0,0)}
}
function point(e){let r=canvas.getBoundingClientRect();const sx=(e.clientX-r.left)/r.width,sy=(e.clientY-r.top)/r.height;return {x:e.clientX-r.left,y:e.clientY-r.top,nx:sx+(tracking?orientDelta.yaw/60:0),ny:sy-(tracking?orientDelta.pitch/45:0),screenX:sx,screenY:sy}}
function skyAt(p){if(!mask)return false;const sx=p.screenX??p.nx,sy=p.screenY??p.ny;let x=Math.max(0,Math.min(maskW-1,Math.floor(sx*maskW))),y=Math.max(0,Math.min(maskH-1,Math.floor(sy*maskH)));return mask[y*maskW+x]>70}
canvas.addEventListener('pointerdown',e=>{if(!stream)return;painting=true;canvas.setPointerCapture(e.pointerId);let p=point(e);if(tool==='inspect'){inspect=!inspect;mode.textContent=inspect?'空マスク表示':'カメラ追従';return}last=p; if(tool==='cloud'&&skyAt(p)){clouds.push({points:[{x:p.nx,y:p.ny}],size:+document.querySelector('#brush').value,alpha:+document.querySelector('#opacity').value/100,style:cloudStyle});} else if(tool==='erase') eraseAt(p);});
canvas.addEventListener('pointermove',e=>{if(!painting||!last)return;let p=point(e), dx=p.x-last.x,dy=p.y-last.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/12));for(let j=1;j<=steps;j++){let t=j/steps,q={x:last.x+dx*t,y:last.y+dy*t,nx:last.nx+(p.nx-last.nx)*t,ny:last.ny+(p.ny-last.ny)*t,screenX:(last.x+dx*t)/stage.clientWidth,screenY:(last.y+dy*t)/stage.clientHeight};if(!skyAt(q))continue;if(tool==='cloud'&&clouds.length)clouds[clouds.length-1].points.push({x:q.nx,y:q.ny});else if(tool==='erase')eraseAt(q)}last=p});
function eraseAt(p){const radius=(+document.querySelector('#brush').value)/2/Math.min(stage.clientWidth,stage.clientHeight);for(let i=clouds.length-1;i>=0;i--){let c=clouds[i];c.points=c.points.filter(q=>Math.hypot((q.x-p.nx)*stage.clientWidth,(q.y-p.ny)*stage.clientHeight)>+document.querySelector('#brush').value*.8);if(!c.points.length)clouds.splice(i,1)}}
canvas.addEventListener('pointerup',()=>{painting=false;last=null});canvas.addEventListener('pointercancel',()=>{painting=false;last=null});

function onOrientation(e){if(!tracking||e.alpha==null||e.beta==null)return;if(!orientBase){orientBase={alpha:e.alpha,beta:e.beta};return}let dy=e.alpha-orientBase.alpha;while(dy>180)dy-=360;while(dy< -180)dy+=360;orientDelta.yaw=-dy;orientDelta.pitch=e.beta-orientBase.beta}
document.querySelector('#track').onclick=async()=>{if(!stream){status.textContent='先にカメラを開始してください。';return}if(tracking){tracking=false;window.removeEventListener('deviceorientation',onOrientation,true);orientDelta={yaw:0,pitch:0};orientBase=null;document.querySelector('#track').textContent='向き追従OFF';status.textContent='向き追従を停止しました。';return}try{if(typeof DeviceOrientationEvent==='undefined')throw new Error('このブラウザは向きセンサーに対応していません');if(typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted')throw new Error('センサー利用が許可されませんでした')}tracking=true;orientBase=null;orientDelta={yaw:0,pitch:0};window.addEventListener('deviceorientation',onOrientation,true);document.querySelector('#track').textContent='向き追従ON';status.textContent='端末の向きを取得中です。Safariのセンサー利用を許可してください。'}catch(e){status.textContent='向き追従を開始できません: '+e.message}}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{cloudStyle=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));status.textContent=cloudStyle==='storm'?'雨雲風の暗い雲を描きます。':'明るい白い雲を描きます。'});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));if(tool==='inspect'){inspect=!inspect;tool='cloud';document.querySelector('[data-tool="cloud"]').classList.add('active');mode.textContent=inspect?'空マスク表示':'カメラ追従'}status.textContent=tool==='erase'?'なぞった場所の雲を消します。':'空をなぞると雲を追加します。'});
document.querySelector('#brush').oninput=e=>document.querySelector('#brushN').textContent=e.target.value;document.querySelector('#opacity').oninput=e=>document.querySelector('#opacityN').textContent=e.target.value+'%';document.querySelector('#clear').onclick=()=>{clouds=[];inspect=false;mode.textContent=stream?'カメラ追従':'カメラ未開始'};
document.querySelector('#start').onclick=async()=>{try{status.textContent='空認識モデルを読み込み中です。初回は少し時間がかかります。';if(!segmenter){const {pipeline}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');segmenter=await pipeline('image-segmentation','Xenova/segformer-b0-finetuned-ade-512-512',{device:'wasm'});}stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();empty.style.display='none';document.querySelector('#start').disabled=true;document.querySelector('#stop').disabled=false;mode.textContent='空を解析中';status.textContent='空認識モデルで映像を端末内解析しています。曇天にも対応します。空をなぞって雲を描けます。';cancelAnimationFrame(raf);draw();detectSky()}catch(e){status.textContent='カメラを開始できません。Safariのカメラ許可とHTTPS接続を確認してください。';}};
document.querySelector('#stop').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;tracking=false;window.removeEventListener('deviceorientation',onOrientation,true);orientBase=null;orientDelta={yaw:0,pitch:0};document.querySelector('#track').textContent='向き追従OFF';video.srcObject=null;cancelAnimationFrame(raf);ctx.clearRect(0,0,canvas.width,canvas.height);empty.style.display='grid';document.querySelector('#start').disabled=false;document.querySelector('#stop').disabled=true;mode.textContent='カメラ未開始';status.textContent='カメラを停止しました。'};
})();
</script></body></html>
