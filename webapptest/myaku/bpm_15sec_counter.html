<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>15秒カウント脈拍/BPMチェッカー（準備3秒つき）</title>
  <!-- スマホ向け表示最適化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      /* モバイルで少し大きめのベースフォント */
      font-size: 16px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      padding: 20px 20px 18px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px; /* タブレット以上では中央に適度な幅 */
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 1.2rem;
    }

    p {
      margin-top: 2px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #4b5563;
    }

    #timerDisplay {
      font-size: 3rem;
      font-weight: 700;
      margin: 16px 0 4px;
    }

    #timerSub {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 16px;
    }

    button {
      font-size: 1rem;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.05s ease, box-shadow 0.1s ease, background 0.15s ease;
    }

    #startButton {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(37,99,235,0.4);
      margin-bottom: 14px;
      width: 100%;           /* スマホでは横いっぱい */
    }

    #startButton:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 3px 8px rgba(37,99,235,0.4);
    }

    #startButton:disabled {
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
    }

    .input-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 10px 0 6px;
      flex-wrap: wrap; /* スマホで窮屈なときは折り返し */
    }

    .input-row label {
      font-size: 0.9rem;
    }

    input[type="number"] {
      width: 90px;
      padding: 8px 8px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
      text-align: right;
    }

    #calcButton {
      background: #10b981;
      color: #ffffff;
      padding: 8px 16px;
      font-size: 0.9rem;
    }

    #calcButton:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    #result {
      margin-top: 6px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    #error {
      margin-top: 4px;
      font-size: 0.8rem;
      color: #b91c1c;
      min-height: 1em;
    }

    #note {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #6b7280;
      line-height: 1.5;
      text-align: left;
    }

    /* かなり小さい画面（幅360px以下）向けに少し詰める */
    @media (max-width: 360px) {
      h1 {
        font-size: 1.05rem;
      }
      #timerDisplay {
        font-size: 2.6rem;
      }
      .card {
        padding: 16px 16px 14px;
        border-radius: 14px;
      }
      button {
        font-size: 0.95rem;
      }
    }

    /* 逆に大きめの画面では少しゆったり表示 */
    @media (min-width: 768px) {
      body {
        padding: 24px;
      }
      #timerDisplay {
        font-size: 3.4rem;
      }
      h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>15秒カウントで脈拍/BPM計測（準備3秒つき）</h1>
    <p>スタート後、3秒の準備時間があり、その後自動で15秒計測が始まります。</p>

    <div id="timerDisplay">15.0</div>
    <div id="timerSub">秒</div>

    <button id="startButton">スタート（Spaceでも可）</button>

    <div class="input-row">
      <label for="beatInput">15秒で数えた回数：</label>
      <input
        id="beatInput"
        type="number"
        min="0"
        step="1"
        placeholder="例: 18"
        disabled
      />
      <button id="calcButton" disabled>計算</button>
    </div>

    <div id="result"></div>
    <div id="error"></div>

    <div id="note">
      ・Spaceキーでもスタートできます（PC向け）。<br>
      ・3秒の準備後に自動で15秒計測スタートします。<br>
      ・計測が終わったら回数を入力して「計算」を押すとBPMが表示されます。<br>
      ・計算式：<code>回数 × 4 = 1分あたりの脈拍数（BPM）</code>
    </div>
  </div>

  <script>
    const prepSec = 3;      // 準備時間3秒
    const durationSec = 15; // 計測時間15秒

    const timerDisplay = document.getElementById('timerDisplay');
    const timerSub     = document.getElementById('timerSub');
    const startButton  = document.getElementById('startButton');
    const beatInput    = document.getElementById('beatInput');
    const calcButton   = document.getElementById('calcButton');
    const resultEl     = document.getElementById('result');
    const errorEl      = document.getElementById('error');

    let countdownId = null;
    let running     = false;

    function updateDisplay(val, label = "秒") {
      timerDisplay.textContent = val.toFixed(1);
      timerSub.textContent = label;
    }

    function clearTimers() {
      if (countdownId !== null) {
        clearInterval(countdownId);
        countdownId = null;
      }
    }

    function startPrepCountdown() {
      if (running) return;
      running = true;

      clearTimers();
      resultEl.textContent = "";
      errorEl.textContent = "";
      beatInput.value = "";

      startButton.disabled = true;
      beatInput.disabled = true;
      calcButton.disabled = true;

      let remaining = prepSec;
      updateDisplay(remaining, "準備");

      const startTime = performance.now();

      countdownId = setInterval(() => {
        const now = performance.now();
        const elapsed = (now - startTime) / 1000;
        const newRemaining = prepSec - elapsed;

        if (newRemaining <= 0) {
          clearTimers();
          startMainCountdown(); // 準備3秒終了 → 15秒計測へ
        } else {
          updateDisplay(newRemaining, "準備");
        }
      }, 100);
    }

    function startMainCountdown() {
      let remaining = durationSec;
      updateDisplay(remaining, "計測");

      const startTime = performance.now();

      countdownId = setInterval(() => {
        const now = performance.now();
        const elapsed = (now - startTime) / 1000;
        const newRemaining = durationSec - elapsed;

        if (newRemaining <= 0) {
          clearTimers();
          running = false;
          updateDisplay(0, "終了");

          beatInput.disabled = false;
          calcButton.disabled = false;
          beatInput.focus();
          startButton.disabled = false;

        } else {
          updateDisplay(newRemaining, "計測");
        }
      }, 100);
    }

    function calcBpm() {
      errorEl.textContent = "";
      resultEl.textContent = "";

      const v = beatInput.value.trim();
      const beats = Number(v);

      if (!v || !Number.isFinite(beats) || beats <= 0) {
        errorEl.textContent = "15秒間に数えた回数（1以上の整数）を入力してください。";
        return;
      }

      const bpm = beats * (60 / durationSec);
      resultEl.textContent = `推定脈拍：${bpm.toFixed(1)} BPM`;
    }

    startButton.addEventListener('click', startPrepCountdown);
    calcButton.addEventListener('click', calcBpm);

    beatInput.addEventListener('keydown', (e) => {
      if (e.key === "Enter") calcBpm();
    });

    // PC用：Spaceキーでもスタート
    window.addEventListener('keydown', (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        startPrepCountdown();
      }
    });

    updateDisplay(durationSec);
  </script>
</body>
</html>
