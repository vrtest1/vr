<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>15秒カウント脈拍/BPMチェッカー（準備3秒つき）</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      padding: 24px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.3rem;
    }
    p {
      margin-top: 4px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #4b5563;
    }
    #timerDisplay {
      font-size: 2.8rem;
      font-weight: 700;
      margin: 12px 0 4px;
    }
    #timerSub {
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 16px;
    }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.05s ease, box-shadow 0.1s ease, background 0.15s ease;
    }
    #startButton {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(37,99,235,0.4);
      margin-bottom: 12px;
    }
    #startButton:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 3px 8px rgba(37,99,235,0.4);
    }
    #startButton:disabled {
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
    }

    .input-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }
    input[type="number"] {
      width: 90px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
      text-align: right;
    }
    #calcButton {
      background: #10b981;
      color: #ffffff;
      padding: 8px 14px;
      font-size: 0.9rem;
    }
    #calcButton:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    #result {
      margin-top: 8px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    #error {
      margin-top: 4px;
      font-size: 0.8rem;
      color: #b91c1c;
      min-height: 1em;
    }
    #note {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #6b7280;
      line-height: 1.4;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>15秒カウントで脈拍/BPM計測（準備3秒つき）</h1>
    <p>スタート後、3秒の準備時間があり、その後自動で15秒計測が始まります。</p>

    <div id="timerDisplay">15.0</div>
    <div id="timerSub">秒</div>

    <button id="startButton">スタート（Spaceでも可）</button>

    <div class="input-row">
      <label for="beatInput">15秒で数えた回数：</label>
      <input
        id="beatInput"
        type="number"
        min="0"
        step="1"
        placeholder="例: 18"
        disabled
      />
      <button id="calcButton" disabled>計算</button>
    </div>

    <div id="result"></div>
    <div id="error"></div>

    <div id="note">
      ・Spaceキーでもスタートできます。<br>
      ・3秒の準備後に自動で15秒計測スタートします。<br>
      ・計算式：<code>回数 × 4 = BPM</code>
    </div>
  </div>

  <script>
    const prepSec = 3;      // 準備時間3秒
    const durationSec = 15; // 計測時間15秒

    const timerDisplay = document.getElementById('timerDisplay');
    const startButton  = document.getElementById('startButton');
    const beatInput    = document.getElementById('beatInput');
    const calcButton   = document.getElementById('calcButton');
    const resultEl     = document.getElementById('result');
    const errorEl      = document.getElementById('error');

    let countdownId = null;
    let running     = false;

    function updateDisplay(val, label = "秒") {
      timerDisplay.textContent = val.toFixed(1);
      timerSub.textContent = label;
    }

    function startPrepCountdown() {
      if (running) return;
      running = true;

      resultEl.textContent = "";
      errorEl.textContent = "";
      beatInput.value = "";

      startButton.disabled = true;
      beatInput.disabled = true;
      calcButton.disabled = true;

      let remaining = prepSec;
      updateDisplay(remaining, "準備");

      const startTime = performance.now();

      countdownId = setInterval(() => {
        const now = performance.now();
        const elapsed = (now - startTime) / 1000;
        const newRemaining = prepSec - elapsed;

        if (newRemaining <= 0) {
          clearInterval(countdownId);
          startMainCountdown(); // → 3秒後、15秒計測へ
        } else {
          updateDisplay(newRemaining, "準備");
        }
      }, 100);
    }

    function startMainCountdown() {
      let remaining = durationSec;
      updateDisplay(remaining, "計測");

      const startTime = performance.now();

      countdownId = setInterval(() => {
        const now = performance.now();
        const elapsed = (now - startTime) / 1000;
        const newRemaining = durationSec - elapsed;

        if (newRemaining <= 0) {
          clearInterval(countdownId);
          running = false;
          updateDisplay(0, "終了");

          beatInput.disabled = false;
          calcButton.disabled = false;
          beatInput.focus();
          startButton.disabled = false;

        } else {
          updateDisplay(newRemaining, "計測");
        }
      }, 100);
    }

    function calcBpm() {
      errorEl.textContent = "";
      resultEl.textContent = "";

      const beats = Number(beatInput.value.trim());

      if (!Number.isFinite(beats) || beats <= 0) {
        errorEl.textContent = "15秒間の回数を正しく入力してください。";
        return;
      }

      const bpm = beats * (60 / durationSec);
      resultEl.textContent = `推定脈拍：${bpm.toFixed(1)} BPM`;
    }

    startButton.addEventListener('click', startPrepCountdown);
    calcButton.addEventListener('click', calcBpm);

    beatInput.addEventListener('keydown', (e) => {
      if (e.key === "Enter") calcBpm();
    });

    // ★ Spaceキーでもスタート
    window.addEventListener('keydown', (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        startPrepCountdown();
      }
    });

    updateDisplay(durationSec);
  </script>
</body>
</html>
