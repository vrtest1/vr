<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMBER — 焚き火</title><meta name="description" content="薪を組み、風を感じ、火を育てる。操作できる焚き火。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101316'/%3E%3Cpath d='M17 3Q25 16 24 22Q23 30 14 28Q3 25 11 13Q10 22 15 20Q20 17 17 3' fill='%23ff963f'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><canvas id="scene" aria-label="操作できる3Dの焚き火"></canvas><header><div class="brand">EMBER<span>焚き火の時間</span></div><div class="status"><i></i><span id="engine">準備中</span></div></header><main><section id="panel"><div class="panelhead"><span>火を育てる</span><button id="fold" aria-label="操作パネルを折りたたむ">−</button></div><div id="controls"><div class="actions"><button id="add" class="primary">＋ 薪を追加</button><button id="ignite">着火</button><button id="extinguish">消火</button></div><label>露出 <output id="exposureVal">0.65×</output><input id="exposure" type="range" min="0.1" max="2.0" step="0.01" value="0.65"></label><label>Bloom <output id="bloomVal">0.30</output><input id="bloom" type="range" min="0" max="2" step="0.01" value="0.30"></label><label>音量 <output id="volumeVal">45%</output><input id="volume" type="range" min="0" max="100" step="1" value="45"></label><div class="row"><button id="mute" aria-pressed="false">ミュート</button></div><label>風の強さ <output id="windVal">0.6 m/s</output><input id="wind" type="range" min="0" max="5" step="0.1" value="0.6"></label><label>風向き <output id="dirVal">45°</output><input id="direction" type="range" min="0" max="360" value="45"></label><label>時間の速さ <output id="speedVal">1×</output><input id="speed" type="range" min="0.25" max="12" step="0.25" value="1"></label><div class="row"><button id="pause">一時停止</button><button id="reset">最初から</button></div><div id="selected"><span class="eyebrow">選択した薪</span><p id="selection">薪をクリックして選択</p><div class="meters"><div>温度 <b id="temp">—</b></div><div>燃料 <b id="fuel">—</b></div><div>炭化 <b id="char">—</b></div></div><div class="row manip"><button id="left" aria-label="左に回転">↶ 回転</button><button id="right" aria-label="右に回転">回転 ↷</button></div><div class="row manip"><button id="up">持ち上げる</button><button id="down">下げる</button><button id="drop">放す</button></div></div><p class="note">薪をドラッグして移動。保持中はホイールで高さ、Q / E で回転（Shift併用で傾ける）。空いた場所をドラッグして視点を回転。</p><details><summary>シミュレーションについて</summary><p>剛体の重力・衝突と、薪ごとの熱伝達・燃料消費を計算します。炎は体積描画、煙・火の粉はWebGPUで浮力・風・乱流を近似します。科学的な燃焼解析ではありません。</p></details></div></section></main><footer><div><span class="eyebrow">FIRE ACTIVITY</span><div id="activity">薪を置いて、火を育てましょう</div></div><div class="stats"><span id="count">0 本</span><span id="clock">00:00</span><button id="hide">眺める</button></div></footer><div id="toast" role="status"></div><div id="loading">火の準備をしています…</div><script src="app.js" type="module"></script></body></html>
