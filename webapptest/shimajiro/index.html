<head>

<title>マルチタッチ腕ぐるぐるデモ</title>
<style>
  html,body {

    line-height:1.35;
  }

    border:1px solid #bbb;
    border-radius:10px;
    background:white;
    padding:9px 14px;
    font-size:15px;
    min-height:44px;
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:white;
    border-radius:14px;
    box-shadow:0 1px 8px rgba(0,0,0,.12);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .status {
    margin-top:7px;
    font-size:13px;
    color:#666;
    text-align:center;
  }
</style>
</head>

  const img = {};
  let loaded = 0;
  for (const [k, s] of Object.entries(src)) {
    const im = new Image();
    im.onload = () => {
      img[k] = im;
      loaded++;
      if (loaded === Object.keys(src).length) {
        resetPose();
        draw();
      }
    };
    im.src = s;
  }

  // 画面上の「左/右」で命名。
  // arm画像のアンカーは、素材の端点に合わせた近似値です。
  const arms = {
    left: {
      shoulder: {x: 375, y: 885},
      wrist: {x: 555, y: 965},
      home: {x: 555, y: 965},
      armImage: "armR",
      handImage: "handR",
      armA: {x: 1, y: 123},
      armB: {x: 324, y: 239},
      handAnchor: {x: 145, y: 315},
      handScale: 0.76,
      pointerId: null,
      lastAngle: null,
      lastTime: 0,
      angularSpeed: 0
    },
    right: {
      shoulder: {x: 1318, y: 885},
      wrist: {x: 1138, y: 965},
      home: {x: 1138, y: 965},
      armImage: "armL",
      handImage: "handL",
      armA: {x: 334, y: 123},
      armB: {x: 11, y: 239},
      handAnchor: {x: 148, y: 315},
      handScale: 0.76,
      pointerId: null,
      lastAngle: null,
      lastTime: 0,
      angularSpeed: 0
    }
  };

  const pointerToSide = new Map();

  function resetPose() {
    for (const a of Object.values(arms)) {
      // アーム画像そのものの肩アンカー→先端アンカーの長さを使う。
      // これにより手首位置と描画されたアーム先端が常に一致する。
      const armLen = Math.hypot(a.armB.x-a.armA.x, a.armB.y-a.armA.y);
      let dx = a.home.x-a.shoulder.x;
      let dy = a.home.y-a.shoulder.y;
      const r = Math.hypot(dx,dy) || 1;
      a.wrist.x = a.shoulder.x + dx/r * armLen;
      a.wrist.y = a.shoulder.y + dy/r * armLen;
      a.pointerId = null;
      a.lastAngle = null;
      a.lastTime = 0;
      a.angularSpeed = 0;
    }
    pointerToSide.clear();
    status.textContent = "手をタッチして、そのまま肩の周りへ回してください。";
    draw();
  }

  resetBtn.addEventListener("click", resetPose);

  function canvasPoint(ev) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) * W / r.width,
      y: (ev.clientY - r.top) * H / r.height
    };
  }

  function dist2(a,b) {
    const dx=a.x-b.x, dy=a.y-b.y;
    return dx*dx+dy*dy;
  }

  function claimHand(p, pointerId) {
    const candidates = [];
    for (const [side,a] of Object.entries(arms)) {
      if (a.pointerId !== null) continue;
      candidates.push([dist2(p,a.wrist), side, a]);
    }
    candidates.sort((x,y)=>x[0]-y[0]);
    // 手の見た目より少し広い当たり判定
    if (candidates.length && candidates[0][0] < 190*190) {
      const [,side,a] = candidates[0];
      a.pointerId = pointerId;
      pointerToSide.set(pointerId, side);
      return side;
    }
    return null;
  }

  function moveHand(side,p) {
    const a=arms[side];
    let dx=p.x-a.shoulder.x, dy=p.y-a.shoulder.y;
    const r=Math.hypot(dx,dy);
    if (r < 0.001) return;

    const now = performance.now();
    const angle = Math.atan2(dy, dx);

    if (a.lastAngle !== null && a.lastTime > 0) {
      let da = angle - a.lastAngle;
      while (da > Math.PI) da -= Math.PI*2;
      while (da < -Math.PI) da += Math.PI*2;
      const dt = Math.max(1, now-a.lastTime) / 1000;
      const inst = Math.abs(da) / dt;
      a.angularSpeed = a.angularSpeed*0.65 + inst*0.35;
    }

    a.lastAngle = angle;
    a.lastTime = now;

    const armLen = Math.hypot(a.armB.x-a.armA.x, a.armB.y-a.armA.y);
    dx*=armLen/r;
    dy*=armLen/r;
    a.wrist.x=a.shoulder.x+dx;
    a.wrist.y=a.shoulder.y+dy;
  }

  canvas.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    const p=canvasPoint(ev);
    const side=claimHand(p,ev.pointerId);
    if (side) {
      canvas.setPointerCapture?.(ev.pointerId);
      moveHand(side,p);
      status.textContent = pointerToSide.size >= 2 ? "両手を同時操作中" : "もう1本の指でも反対の手を動かせます。";
      draw();
    }
  }, {passive:false});

  canvas.addEventListener("pointermove", ev => {
    const side=pointerToSide.get(ev.pointerId);
    if (!side) return;
    ev.preventDefault();
    moveHand(side,canvasPoint(ev));
    draw();
  }, {passive:false});

  function release(ev) {
    const side=pointerToSide.get(ev.pointerId);
    if (!side) return;
    arms[side].pointerId=null;
    arms[side].lastAngle=null;
    arms[side].lastTime=0;
    pointerToSide.delete(ev.pointerId);
    status.textContent = pointerToSide.size ? "片手を操作中" : "手をタッチして、そのまま肩の周りへ回してください。";
    draw();
    requestAnimationFrame(decayMotion);
  }
  canvas.addEventListener("pointerup",release);
  canvas.addEventListener("pointercancel",release);
  canvas.addEventListener("lostpointercapture",release);

  function drawArm(a) {
    const im=img[a.armImage];
    if(!im) return;
    const sx=a.armA.x, sy=a.armA.y;
    const ex=a.armB.x, ey=a.armB.y;
    const svx=ex-sx, svy=ey-sy;
    const tvx=a.wrist.x-a.shoulder.x, tvy=a.wrist.y-a.shoulder.y;
    const ang=Math.atan2(tvy,tvx)-Math.atan2(svy,svx);

    ctx.save();
    ctx.translate(a.shoulder.x,a.shoulder.y);
    ctx.rotate(ang);
    // アーム画像は拡大縮小せず、素材そのままのサイズで回転。
    ctx.drawImage(im,-sx,-sy);
    ctx.restore();
  }

  function drawHand(a) {
    const im=img[a.handImage];
    if(!im) return;

    // 手首位置はアーム先端に完全固定しつつ、
    // 手の画像自体は常に画面上方向を向けたままにする。
    ctx.save();
    ctx.translate(a.wrist.x,a.wrist.y);
    ctx.scale(a.handScale,a.handScale);
    ctx.drawImage(im,-a.handAnchor.x,-a.handAnchor.y);
    ctx.restore();
  }

  function drawTouchHint(a) {
    if (a.pointerId === null) return;
    ctx.save();
    ctx.beginPath();
    ctx.arc(a.wrist.x,a.wrist.y,42,0,Math.PI*2);
    ctx.lineWidth=7;
    ctx.strokeStyle="rgba(50,120,255,.55)";
    ctx.stroke();
    ctx.restore();
  }

  function drawTornado(a) {
    // 高速回転時、各アームの回転中心から左右方向へ広がる
    // 「横向きの渦筒」を描く。中央に共通の渦は作らない。
    const threshold = 3.0;
    if (a.angularSpeed <= threshold) return;

    const intensity = Math.min(1, (a.angularSpeed-threshold)/8.0);
    const cx = a.shoulder.x;
    const cy = a.shoulder.y;
    const dir = (a === arms.left) ? -1 : 1;   // 左腕は左へ、右腕は右へ
    const now = performance.now();

    // 横方向への伸び。速いほど長く・太くなる。
    const length = 260 + intensity * 520;
    const nearH = 62 + intensity * 75;
    const farH  = 145 + intensity * 250;
    const rings = 9 + Math.floor(intensity * 15);

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // アーム中心付近の小さな根元渦。
    for (let i=0; i<3; i++) {
      const r = 34 + i*18 + intensity*18;
      ctx.strokeStyle = `rgba(8,8,8,${0.12 + intensity*0.48 - i*0.025})`;
      ctx.lineWidth = 4.5 - i*0.5 + intensity*1.5;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r*0.42, 0, 0, Math.PI*1.7);
      ctx.stroke();
    }

    // 肩から外側へ向かうほど大きくなる楕円リング。
    // これでユーザーのスケッチのような「横向き竜巻」に見せる。
    for (let i=0; i<rings; i++) {
      const t = i / Math.max(1, rings-1);
      const ease = t*t;
      const x = cx + dir * (35 + t*length);

      const h = nearH + (farH-nearH) * ease;
      const w = 55 + h * (1.35 + 0.20*t);

      // 少し上下に揺らして機械的な同心円感を減らす。
      const y = cy + Math.sin(now*0.005 + i*0.75) * (4 + 7*t);
      const phase = (now*0.006 + i*0.72) % (Math.PI*2);
      const arcLen = Math.PI * (1.08 + intensity*0.48);

      ctx.strokeStyle = `rgba(8,8,8,${0.10 + 0.20*t + intensity*0.55})`;
      ctx.lineWidth = 2.5 + 5.0*t + intensity*5.0;

      ctx.beginPath();
      ctx.ellipse(
        x, y, w, h,
        0,
        phase - arcLen/2,
        phase + arcLen/2
      );
      ctx.stroke();

      // 補助弧を追加して漫画の渦線っぽくする。
      if (i % 2 === 0) {
        ctx.strokeStyle = `rgba(10,10,10,${0.06 + 0.13*t + intensity*0.34})`;
        ctx.lineWidth = 2.0 + 3.2*t;
        ctx.beginPath();
        ctx.ellipse(
          x + dir*4, y+3,
          w*0.82, h*0.72,
          0,
          phase + Math.PI*0.70,
          phase + Math.PI*1.30
        );
        ctx.stroke();
      }
    }

    // 一番外側の大きな渦口。左右それぞれ独立。
    const endX = cx + dir * (length + 70);
    const endW = 220 + intensity * 430;
    const endH = 90 + intensity * 210;

    for (let i=0; i<4; i++) {
      const s = 1 + i*0.10;
      ctx.strokeStyle = `rgba(5,5,5,${0.14 - i*0.020 + intensity*0.58})`;
      ctx.lineWidth = 6.0 - i*0.8 + intensity*6.0;
      ctx.beginPath();
      ctx.ellipse(
        endX,
        cy + i*3,
        endW*s,
        endH*s,
        0,
        Math.PI*0.05,
        Math.PI*1.78
      );
      ctx.stroke();
    }

    // さらに速い時は外側へ抜ける短い流線を足す。
    if (intensity > 0.35) {
      const rays = 6 + Math.floor(intensity*5);
      for (let i=0; i<rays; i++) {
        const yy = cy - endH*0.65 + (i/(rays-1))*endH*1.3;
        const x1 = endX + dir*(endW*0.72);
        const x2 = x1 + dir*(45 + intensity*75 + (i%2)*25);
        ctx.strokeStyle = `rgba(15,15,15,${0.10 + intensity*0.18})`;
        ctx.lineWidth = 2.5 + intensity*2.5;
        ctx.beginPath();
        ctx.moveTo(x1, yy);
        ctx.lineTo(x2, yy + Math.sin(i*1.2)*12);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawSpeedLines(a) {
    const threshold = 2.3;
    if (a.angularSpeed <= threshold) return;

    const intensity = Math.min(1, (a.angularSpeed-threshold)/7.0);
    const baseAngle = Math.atan2(a.wrist.y-a.shoulder.y, a.wrist.x-a.shoulder.x);
    const radius = Math.hypot(a.wrist.x-a.shoulder.x, a.wrist.y-a.shoulder.y) + 45;
    const count = 3 + Math.floor(intensity*5);

    ctx.save();
    ctx.lineCap = "round";
    ctx.strokeStyle = `rgba(25,25,25,${0.28 + intensity*0.42})`;

    for (let i=0;i<count;i++) {
      const offset = (i-(count-1)/2) * (0.09 + intensity*0.025);
      const r = radius + (i%2 ? 16 : -8) + i*3;
      const len = 0.22 + intensity*0.32 - Math.abs(i-(count-1)/2)*0.012;
      const center = baseAngle - 0.28 - intensity*0.18;
      const startA = center - len*0.5 + offset;
      const endA   = center + len*0.5 + offset;

      ctx.beginPath();
      ctx.lineWidth = 5 + intensity*5 - (i%3)*1.2;
      ctx.arc(a.shoulder.x, a.shoulder.y, r, startA, endA);
      ctx.stroke();
    }

    if (intensity > 0.45) {
      const extra = 3 + Math.floor(intensity*3);
      for (let i=0;i<extra;i++) {
        const ang = baseAngle - 0.65 + i*0.16;
        const r1 = radius + 10 + i*8;
        const r2 = r1 + 24 + intensity*24;
        ctx.beginPath();
        ctx.lineWidth = 3 + intensity*3;
        ctx.moveTo(a.shoulder.x + Math.cos(ang)*r1,
                   a.shoulder.y + Math.sin(ang)*r1);
        ctx.lineTo(a.shoulder.x + Math.cos(ang)*r2,
                   a.shoulder.y + Math.sin(ang)*r2);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function decayMotion() {
    let active=false;
    for (const a of Object.values(arms)) {
      if (a.pointerId === null && a.angularSpeed > 0.02) {
        a.angularSpeed *= 0.88;
        active=true;
      }
    }
    if (active) {
      draw();
      requestAnimationFrame(decayMotion);
    }
  }

  function draw() {
    if(!img.body) return;
    ctx.clearRect(0,0,W,H);

    // 元の胴体を最初に描画
    ctx.drawImage(img.body,0,0,W,H);

    // 腕を胴体より前に描画して、動いているアームが見えるようにする
    drawArm(arms.left);
    drawArm(arms.right);

    // 高速回転時、肩の回転中心からモノクロの渦・竜巻を出す
    drawTornado(arms.left);
    drawTornado(arms.right);

    // 漫画風円弧エフェクト
    drawSpeedLines(arms.left);
    drawSpeedLines(arms.right);

    // 手は最前面
    drawHand(arms.left);
    drawHand(arms.right);

    drawTouchHint(arms.left);
    drawTouchHint(arms.right);
  }
})();
</script>
</body>
</html>
