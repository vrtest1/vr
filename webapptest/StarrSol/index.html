<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メガミソルジャー</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            background-color: #000;
        }
        #bgm {
            display: none;
        }
        #startScreen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1;
        }
        #startButton {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        #startButton:hover {
            background-color: #45a049;
        }
        .title {
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
            font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="title">メガミソルジャー</div>
        <button id="startButton">ゲームスタート</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <audio id="bgm" loop>
        <source src="music/Untitled.mp3" type="audio/mpeg">
    </audio>
    <script src="game.js"></script>
</body>
</html>
