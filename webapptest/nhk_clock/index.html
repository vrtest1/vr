			<script>

				function showClock() { /* 運針 */
					var nowTime = new Date();
					var mSecTime = nowTime.getMilliseconds();
					var secTime = nowTime.getSeconds();
					var minTime = nowTime.getMinutes();
					var hourTime = nowTime.getHours();

					document.getElementById("secHand").setAttribute("transform", "rotate(" + (secTime * 6 + ((mSecTime < 100) ? ((mSecTime < 50) ? +0.2 : -0.05) : 0)) + ", 533, 300)");
					document.getElementById("minHand").setAttribute("transform", "rotate(" + (minTime * 6 + secTime * 0.1 + mSecTime * 0.00001) + ", 533, 300)");
					document.getElementById("hourHand").setAttribute("transform", "rotate(" + (hourTime * 30 + minTime * 0.5 + secTime * 0.5 / 60 + mSecTime * 0.00003) + ", 533, 300)");
				};

				function tsToggle() {
					/* 時報切替・鳴動 */
					var bellCross = document.getElementById("bellCross");
					var ts_full = document.getElementById("ts_full");

					if (bellCross.getAttribute("opacity") == 0) {
						bellCross.setAttribute("opacity", 1);
						clearInterval(bellTimer);
						ts_full.pause();
					} else {
						bellCross.setAttribute("opacity", 0);
						ts_full.load();
						bellTimer = setInterval(function() {
							var nowTime = new Date();
							var mSecTime = nowTime.getMilliseconds();
							var secTime = nowTime.getSeconds();
							var minTime = nowTime.getMinutes();
							var hourTime = nowTime.getHours();
							var seeqTime = ts_full.currentTime;
							if ((minTime == 0) && (secTime == 0) && (mSecTime < 10) && (seeqTime == 0)) {
								/* 0分0秒（誤差+0.01秒未満）に正報音を再生 */
								ts_full.currentTime = 4 + (mSecTime / 100);
								ts_full.play();
							};
							if ((minTime == 59) && (secTime >= 57) && (mSecTime < 10) && (seeqTime == 0)) {
								/* 59分57～59秒（誤差+0.01秒未満）に予報音を再生 */
								ts_full.currentTime = (secTime - 57) + (mSecTime / 100);
								ts_full.play();
							};
						}, 0);
					};
				};
				
				// イージング関数（アナログの質感を出す）
				function easeOutBack(x) {
					const c1 = 1.70158;
					const c3 = c1 + 1;
					return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
				}

				function showClock() {
					var nowTime = new Date();
					var mSecTime = nowTime.getMilliseconds();
					var secTime = nowTime.getSeconds();
					var minTime = nowTime.getMinutes();
					var hourTime = nowTime.getHours();

					// --- 秒針：アナログ運針 ---
					// 最初の350msで動かして残りは静止（350の部分を変えると速さが変わります）
					var moveProgress = Math.min(mSecTime / 350, 1.0);
					var easedProgress = easeOutBack(moveProgress);
					var secAngle = (secTime * 6) + (easedProgress * 6) - 6;

					// --- 分針・時針：元の計算式をベースに高精度化 ---
					var minAngle = (minTime * 6 + secTime * 0.1 + mSecTime * 0.0001);
					var hourAngle = (hourTime * 30 + minTime * 0.5 + secTime * 0.5 / 60 + mSecTime * 0.00003);

					document.getElementById("secHand").setAttribute("transform", "rotate(" + secAngle + ", 533, 300)");
					document.getElementById("minHand").setAttribute("transform", "rotate(" + minAngle + ", 533, 300)");
					document.getElementById("hourHand").setAttribute("transform", "rotate(" + hourAngle + ", 533, 300)");

					// 次のフレームを描画
					requestAnimationFrame(showClock);
				}

				// 最初の実行を開始
				requestAnimationFrame(showClock);

					</script>
