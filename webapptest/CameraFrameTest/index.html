<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カメラ映像とフレームオーバーレイ (アウトカメラ優先)</title>
    <style>
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }
        #camera {
            width: 100%;
            height: auto;
        }
        #frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="camera" autoplay playsinline></video>
        <img id="frame" src="frame.png" alt="フレーム">
    </div>

    <script>
        const video = document.getElementById('camera');

        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                console.error("カメラの起動に失敗しました:", err);
                // フロントカメラでリトライ
                try {
                    const frontStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = frontStream;
                } catch (frontErr) {
                    console.error("フロントカメラの起動にも失敗しました:", frontErr);
                }
            }
        }

        startCamera();
    </script>
</body>
</html>
