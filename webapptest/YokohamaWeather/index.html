<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>横浜の天気予報</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .weather-display {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            position: relative;
            filter: contrast(1.1);
        }
        .weather-display img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: absolute;
            opacity: 0.015;
            transition: all 0.5s ease;
        }
        .weather-display img.active {
            opacity: 1;
            filter: brightness(1) sepia(0.4) hue-rotate(-6deg) contrast(1.1);
        }
        /* すりガラス効果のオーバーレイ */
        .weather-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            pointer-events: none;
        }
        /* 光の拡散効果（内側） */
        .weather-display::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                circle at center,
                rgba(255, 200, 180, 0.06) 0%,
                rgba(255, 200, 180, 0.06) 50%,
                rgba(255, 200, 180, 0.06) 100%
            );
            mix-blend-mode: screen;
            pointer-events: none;
        }
        /* 追加の光の拡散効果（外側） */
        .weather-display > div::after {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            right: -10%;
            bottom: -10%;
            background: radial-gradient(
                circle at center,
                rgba(255, 190, 170, 0.03) 0%,
                rgba(255, 190, 170, 0.03) 50%,
                rgba(255, 190, 170, 0.03) 100%
            );
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 1;
        }
        #display-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            filter: blur(1px) brightness(1) saturate(1.2) contrast(1.08);
        }
        .display-text {
            color: #ffd9c9;
            font-size: 5vw;
            font-weight: bold;
            position: relative;
            z-index: 10;
        }
        /* 非表示にする要素 */
        .container h1,
        .date,
        .weather-info {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>横浜の天気予報</h1>
        <div id="date" class="date"></div>
        <div id="weather" class="weather-info"></div>
        <div class="weather-display">
            <div id="display-content"></div>
        </div>
    </div>

    <script>
        // 使用する天気アイコンの配列
        const weatherIcons = [
            'tomorrow_large.png',  // tomorrowアイコンを追加
            'sunny_large.png',
            'cloudy_large.png',
            'rain_large.png',
            'snow_large.png',
            'tokidoki_large.png',
            'nochi_large.png'
        ];

        // すべての天気アイコンを事前に表示
        function preloadWeatherIcons() {
            const displayContent = document.getElementById('display-content');
            // 既存の画像をクリア
            displayContent.innerHTML = '';

            // 新しい画像を追加
            weatherIcons.forEach(icon => {
                const img = document.createElement('img');
                img.src = `static/weather_icons/${icon}`;
                img.alt = '天気表示';
                img.style.opacity = '0.02';
                img.style.transition = 'opacity 0.5s ease';
                displayContent.appendChild(img);
            });
        }

        function createImageElement(iconName) {
            // すべての画像の透明度を0.02に設定
            const allImages = document.querySelectorAll('.weather-display img');
            allImages.forEach(img => {
                img.classList.remove('active');
                img.style.opacity = '0.02';
            });

            // 指定されたアイコンの画像を探して透明度を1に設定
            const targetImage = Array.from(allImages).find(img => img.src.endsWith(iconName));
            if (targetImage) {
                targetImage.classList.add('active');
            }
            return null; // 新しい画像は作成しない
        }

        function createTextElement(text) {
            const div = document.createElement('div');
            div.className = 'display-text';
            div.textContent = text;
            return div;
        }

        function updateDisplay(displaySequence, currentIndex) {
            const displayContent = document.getElementById('display-content');
            const currentItem = displaySequence[currentIndex];
            
            // テキストの場合は既存のテキスト要素を更新または作成
            if (currentItem.type === 'text') {
                const existingText = displayContent.querySelector('.display-text');
                if (existingText) {
                    existingText.textContent = currentItem.content;
                } else {
                    displayContent.appendChild(createTextElement(currentItem.content));
                }
            } else {
                // 画像の場合は透明度を更新
                const allImages = document.querySelectorAll('.weather-display img');
                const currentImage = currentItem.content;

                allImages.forEach(img => {
                    const imgName = img.src.split('/').pop(); // ファイル名のみを取得
                    if (imgName === currentImage) {
                        img.style.opacity = '1';
                        img.classList.add('active');
                    } else {
                        img.style.opacity = '0.02';
                        img.classList.remove('active');
                    }
                });
            }
        }

        function getWeatherIcon(weather, weatherCode) {
            console.log('getWeatherIcon input:', { weather, weatherCode }); // デバッグ用

            // 気象庁の天気コードに基づいてアイコンを選択
            if (weatherCode) {
                const code = parseInt(weatherCode);
                
                // 晴れ系（100番台）
                if (code >= 100 && code < 200) {
                    // 基本の晴れ
                    if (code === 100) {
                        return 'sunny_large.png';
                    }
                    // 時々/どきどきの場合
                    if ([101, 102, 103, 104, 105, 106, 107, 108, 110, 112, 113, 115, 116, 120, 121, 122, 123, 124, 140, 160, 170].includes(code)) {
                        return 'tokidoki_large.png';
                    }
                    // 後の場合
                    if ([111, 114, 117, 118, 119, 125, 126, 127, 128, 131, 132, 181].includes(code)) {
                        return 'nochi_large.png';
                    }
                    // 霧の場合（130）は曇りとして扱う
                    if (code === 130) {
                        return 'cloudy_large.png';
                    }
                    // その他の晴れ
                    return 'sunny_large.png';
                }
                
                // 曇り系（200番台）
                else if (code >= 200 && code < 300) {
                    // 基本の曇り
                    if ([200, 209, 231].includes(code)) {
                        return 'cloudy_large.png';
                    }
                    // 時々/どきどきの場合
                    if ([201, 202, 203, 204, 205, 206, 207, 208, 210, 212, 213, 215, 216, 220, 221, 222, 223, 240, 250, 260, 270].includes(code)) {
                        return 'tokidoki_large.png';
                    }
                    // 後の場合
                    if ([211, 214, 217, 218, 219, 224, 225, 228, 229, 281].includes(code)) {
                        return 'nochi_large.png';
                    }
                    // 夜の場合
                    if ([226, 230].includes(code)) {
                        return 'nochi_large.png';
                    }
                    // その他の曇り
                    return 'cloudy_large.png';
                }
                
                // 雨系（300番台）
                else if (code >= 300 && code < 400) {
                    // 基本の雨
                    if ([300, 304, 306, 308, 328, 329, 350].includes(code)) {
                        return 'rain_large.png';
                    }
                    // 時々/どきどきの場合
                    if ([301, 302, 303, 309, 314, 322].includes(code)) {
                        return 'tokidoki_large.png';
                    }
                    // 後の場合
                    if ([311, 313, 315, 316, 317, 320, 321, 323, 324, 325, 326].includes(code)) {
                        return 'nochi_large.png';
                    }
                    // 夜の場合
                    if (code === 327) {
                        return 'nochi_large.png';
                    }
                    // その他の雨
                    return 'rain_large.png';
                }
                
                // 雪系（400番台）
                else if (code >= 400) {
                    // 基本の雪
                    if ([400, 405, 406, 407, 425, 426, 427, 450].includes(code)) {
                        return 'snow_large.png';
                    }
                    // 時々/どきどきの場合
                    if ([401, 402, 403, 409].includes(code)) {
                        return 'tokidoki_large.png';
                    }
                    // 後の場合
                    if ([411, 413, 414, 420, 421, 422, 423].includes(code)) {
                        return 'nochi_large.png';
                    }
                    // その他の雪
                    return 'snow_large.png';
                }
            }

            // 天気コードがない場合はテキストベースで判断
            const weatherText = weather.trim();

            // 「時々」または「一時」を含む場合の処理
            if (weather.includes('時々') || weather.includes('一時') || weather.includes('どきどき')) {
                return 'tokidoki_large.png';
            }

            // 「後」または「のち」を含む場合の処理
            if (weather.includes('後') || weather.includes('のち')) {
                return 'nochi_large.png';
            }

            // 完全一致で判定
            if (weatherText === 'くもり' || weatherText === '曇り') {
                return 'cloudy_large.png';
            }
            if (weatherText === '晴れ' || weatherText === '晴') {
                return 'sunny_large.png';
            }
            if (weatherText === '雨') {
                return 'rain_large.png';
            }
            if (weatherText === '雪') {
                return 'snow_large.png';
            }

            // 部分一致で判定（完全一致で見つからなかった場合）
            if (weather.includes('くもり') || weather.includes('曇')) {
                return 'cloudy_large.png';
            }
            if (weather.includes('雨')) {
                return 'rain_large.png';
            }
            if (weather.includes('雪')) {
                return 'snow_large.png';
            }
            if (weather.includes('晴')) {
                return 'sunny_large.png';
            }

            // デフォルト
            return 'sunny_large.png';
        }

        async function getWeather() {
            try {
                // 最初に画像を事前読み込み
                preloadWeatherIcons();

                const response = await fetch('https://www.jma.go.jp/bosai/forecast/data/forecast/140000.json');
                const data = await response.json();
                
                // 明日の天気を取得
                const tomorrow = data[0].timeSeries[0].areas[0];
                const weather = tomorrow.weathers[1];
                const weatherCode = tomorrow.weatherCodes ? tomorrow.weatherCodes[1] : null;

                console.log('Original weather:', weather); // デバッグ用
                console.log('Weather code:', weatherCode); // デバッグ用

                // 表示シーケンスを作成
                const displaySequence = [];

                // 最初のシーケンス: tomorrow
                displaySequence.push({ type: 'image', content: 'tomorrow_large.png' });

                // 天気コードに基づいて表示シーケンスを設定
                if (weatherCode) {
                    const code = parseInt(weatherCode);
                    console.log('Processing weather code:', code); // デバッグ用

                    // 単一の天気状態のみを表示するコード
                    const singleWeatherCodes = [
                        100,  // 晴れ
                        200,  // 曇り
                        209,  // 霧
                        231,  // 霧
                        300,  // 雨
                        304,  // 雨
                        306,  // 大雨
                        308,  // 暴風雨
                        328,  // 雨
                        329,  // みぞれ
                        350,  // 雷雨
                        400,  // 雪
                        405,  // 大雪
                        406,  // 大雪
                        407,  // 大雪
                        425,  // 雪
                        426,  // 雪
                        427,  // 雪
                        450   // 雷を伴う雪
                    ];

                    // 「のち」を含む天気コード
                    const nochiWeatherCodes = [
                        111, 114, 117, 118, 119, 125, 126, 127, 128, 131, 132, 181,  // 晴れ系
                        211, 214, 217, 218, 219, 224, 225, 228, 229, 281,  // 曇り系
                        311, 313, 315, 316, 317, 320, 321, 323, 324, 325, 326,  // 雨系
                        411, 413, 414, 420, 421, 422, 423   // 雪系
                    ];

                    // 「ときどき」を含む天気コード
                    const tokidokiWeatherCodes = [
                        101, 102, 103, 104, 105, 106, 107, 108, 110, 112, 113, 115, 116, 120, 121, 122, 123, 124, 140, 160, 170,  // 晴れ系
                        201, 202, 203, 204, 205, 206, 207, 208, 210, 212, 213, 215, 216, 220, 221, 222, 223, 240, 250, 260, 270,  // 曇り系
                        301, 302, 303, 309, 314, 322,  // 雨系
                        401, 402, 403, 409   // 雪系
                    ];

                    // 最初の天気状態を決定
                    let firstWeatherIcon;
                    if (code >= 100 && code < 200) {
                        firstWeatherIcon = 'sunny_large.png';
                    } else if (code >= 200 && code < 300) {
                        firstWeatherIcon = 'cloudy_large.png';
                    } else if (code >= 300 && code < 400) {
                        firstWeatherIcon = 'rain_large.png';
                    } else if (code >= 400) {
                        firstWeatherIcon = 'snow_large.png';
                    }
                    console.log('First weather icon:', firstWeatherIcon); // デバッグ用

                    // 2番目の天気状態を決定
                    let secondWeatherIcon = null;
                    
                    // コード番号から2番目の天気を判断
                    if (code >= 100 && code < 200) {
                        // 晴れ系の2番目の天気判定
                        if ([101, 110, 111, 131, 132].includes(code)) {
                            secondWeatherIcon = 'cloudy_large.png';  // 曇り
                        } else if ([102, 103, 106, 107, 108, 112, 113, 114, 120, 121, 122, 123, 125, 126, 127, 128, 140].includes(code)) {
                            secondWeatherIcon = 'rain_large.png';    // 雨
                        } else if ([104, 105, 115, 116, 117, 124, 160, 170, 181].includes(code)) {
                            secondWeatherIcon = 'snow_large.png';    // 雪
                        }
                    } else if (code >= 200 && code < 300) {
                        // 曇り系の2番目の天気判定
                        if ([201, 210, 211, 214, 223].includes(code)) {
                            secondWeatherIcon = 'sunny_large.png';   // 晴れ
                        } else if ([202, 203, 206, 207, 208, 212, 213, 218, 219, 221, 222, 224, 225, 240].includes(code)) {
                            secondWeatherIcon = 'rain_large.png';    // 雨
                        } else if ([204, 205, 215, 216, 217, 228, 229, 250, 260, 270, 281].includes(code)) {
                            secondWeatherIcon = 'snow_large.png';    // 雪
                        }
                    } else if (code >= 300 && code < 400) {
                        // 雨系の2番目の天気判定
                        if ([301, 311, 316, 320, 323, 324, 325].includes(code)) {
                            secondWeatherIcon = 'sunny_large.png';   // 晴れ
                        } else if ([302, 313, 317, 321].includes(code)) {
                            secondWeatherIcon = 'cloudy_large.png';  // 曇り
                        } else if ([303, 309, 314, 315, 322, 326, 329].includes(code)) {
                            secondWeatherIcon = 'snow_large.png';    // 雪
                        }
                    } else if (code >= 400) {
                        // 雪系の2番目の天気判定
                        if ([401, 402, 411, 420].includes(code)) {
                            secondWeatherIcon = 'sunny_large.png';   // 晴れ
                        } else if ([413, 421].includes(code)) {
                            secondWeatherIcon = 'cloudy_large.png';  // 曇り
                        } else if ([403, 409, 414, 422, 423].includes(code)) {
                            secondWeatherIcon = 'rain_large.png';    // 雨
                        }
                    }

                    console.log('Weather code:', code, 'Second weather icon:', secondWeatherIcon); // デバッグ用

                    // 単一の天気状態の場合
                    if (singleWeatherCodes.includes(code)) {
                        console.log('Single weather code detected'); // デバッグ用
                        displaySequence.push({ type: 'image', content: firstWeatherIcon });
                    }
                    // 「のち」を含む天気の場合
                    else if (nochiWeatherCodes.includes(code)) {
                        console.log('Nochi weather code detected'); // デバッグ用
                        displaySequence.push(
                            { type: 'image', content: firstWeatherIcon },
                            { type: 'image', content: 'nochi_large.png' }
                        );
                        if (secondWeatherIcon) {
                            console.log('Adding second weather icon for nochi:', secondWeatherIcon); // デバッグ用
                            displaySequence.push({ type: 'image', content: secondWeatherIcon });
                        }
                    }
                    // 「ときどき」を含む天気の場合
                    else if (tokidokiWeatherCodes.includes(code)) {
                        console.log('Tokidoki weather code detected'); // デバッグ用
                        displaySequence.push(
                            { type: 'image', content: firstWeatherIcon },
                            { type: 'image', content: 'tokidoki_large.png' }
                        );
                        if (secondWeatherIcon) {
                            console.log('Adding second weather icon for tokidoki:', secondWeatherIcon); // デバッグ用
                            displaySequence.push({ type: 'image', content: secondWeatherIcon });
                        }
                    }
                }

                console.log('Final display sequence:', displaySequence); // デバッグ用

                // 日付と天気情報を更新
                document.getElementById('date').textContent = new Date().toLocaleDateString('ja-JP');
                document.getElementById('weather').textContent = `明日の天気: ${weather}`;

                // 表示ループを開始
                let currentIndex = 0;
                updateDisplay(displaySequence, currentIndex);

                // インターバルをクリア（既存のものがあれば）
                if (window.weatherInterval) {
                    clearInterval(window.weatherInterval);
                }

                // 新しいインターバルを設定
                window.weatherInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % displaySequence.length;
                    updateDisplay(displaySequence, currentIndex);
                }, 1500);

            } catch (error) {
                document.getElementById('weather').innerHTML = '<div class="error">天気情報の取得に失敗しました</div>';
                console.error('Error fetching weather:', error);
            }
        }

        // ページ読み込み時に天気情報を取得
        window.addEventListener('load', getWeather);

        // 30秒ごとに天気情報を更新
        setInterval(getWeather, 30000);
    </script>
</body>
</html>
