<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AQUA RING - ウォーターゲーム</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: radial-gradient(ellipse at 50% 30%, #fdf6ea 0%, #e7dccb 60%, #cdbfa8 100%);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  * { touch-action: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #hud {
    position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    color: #5a3220; font-weight: 700;
  }
  #hud .pill {
    background: rgba(255,255,255,0.75); border-radius: 999px; padding: 6px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); font-size: 16px;
  }
  #hud .right { display: flex; gap: 8px; }
  #reset, #bgBtn { pointer-events: auto; border: none; cursor: pointer; color: #5a3220; font: inherit; }
  #bgPanel {
    position: fixed; top: calc(env(safe-area-inset-top) + 54px); right: 12px; max-width: 300px;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end;
    background: rgba(255,250,242,0.92); border-radius: 16px; padding: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }
  #bgPanel button, #bgPanel .colorBtn {
    border: none; border-radius: 999px; padding: 7px 12px; font: 700 14px system-ui, sans-serif;
    background: #fff; color: #5a3220; box-shadow: 0 1px 4px rgba(0,0,0,0.15); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  #bgPanel input[type=color] { width: 26px; height: 22px; border: none; padding: 0; background: none; }
  #bgMsg { width: 100%; text-align: right; font-size: 12px; color: #a33; }
  #bgMsg:empty { display: none; }
  #sensor { position: fixed; left: 12px; top: calc(env(safe-area-inset-top) + 50px); font-size: 12px; color: #7a5a40; pointer-events: none; }
  .jet {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 18px);
    width: min(26vw, 120px); height: min(26vw, 120px); border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.9);
    background: radial-gradient(circle at 40% 35%, #ffffff 0%, #e9e9e9 55%, #c9c9c9 100%);
    box-shadow: 0 6px 0 #a83224, 0 10px 18px rgba(0,0,0,0.25);
    color: #b33a2a; font-weight: 800; font-size: 14px; touch-action: none; opacity: 0.92;
  }
  .jet.on { transform: translateY(5px); box-shadow: 0 1px 0 #a83224, 0 4px 8px rgba(0,0,0,0.25); }
  #btnL { left: 18px; }
  #btnR { right: 18px; }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(60,30,20,0.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .card {
    background: #fffaf2; border-radius: 22px; padding: 26px 26px 22px; max-width: 340px; width: 84vw;
    text-align: center; color: #5a3220; box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .card h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 2px; color: #d6392b; }
  .card p { margin: 8px 0; font-size: 14px; line-height: 1.6; }
  .card button {
    margin-top: 12px; border: none; border-radius: 999px; padding: 12px 38px; font-size: 18px; font-weight: 800;
    background: #d6392b; color: #fff; box-shadow: 0 4px 0 #8e2117; cursor: pointer;
  }
  .hidden { display: none !important; }
  kbd { background: #eee; border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div class="pill" id="score">輪 0 / 12</div>
  <div class="pill" id="time">0.0 秒</div>
  <div class="right">
    <button class="pill" id="bgBtn">背景</button>
    <button class="pill" id="reset">リセット</button>
  </div>
</div>
<div id="bgPanel" class="hidden">
  <button data-bg="gradient">グラデーション</button>
  <label class="colorBtn">色<input type="color" id="bgColor" value="#87c4e8"></label>
  <button data-bg="photo">写真</button>
  <button data-bg="camera">カメラ</button>
  <button data-bg="flip">前/後</button>
  <button data-bg="refr" id="refrBtn">屈折: リアル</button>
  <button data-bg="close">×</button>
  <div id="bgMsg"></div>
  <input type="file" id="bgFile" accept="image/*" hidden>
</div>
<div id="sensor"></div>
<button class="jet" id="btnL">PUSH</button>
<button class="jet" id="btnR">PUSH</button>

<div class="overlay" id="start">
  <div class="card">
    <h1>AQUA RING</h1>
    <p>ボタンを押すと水流が起きて、輪っかが舞い上がります。<br>棒に全部の輪をかけたらクリア！</p>
    <p>📱 本体を傾けると水と輪が傾きます。振ると水が揺れます。</p>
    <p style="font-size:12px;color:#8a6a50">PC: <kbd>F</kbd>/<kbd>J</kbd> 水流、<kbd>←</kbd><kbd>→</kbd> 傾き、<kbd>Space</kbd> 揺らす、ドラッグでも傾き</p>
    <button id="startBtn">スタート</button>
  </div>
</div>
<div class="overlay hidden" id="clear">
  <div class="card">
    <h1>CLEAR!</h1>
    <p id="clearMsg"></p>
    <button id="againBtn">もう一回</button>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
