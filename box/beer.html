<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spill Glass</title>
  <style>
    html, body { margin:0; height:100%; background:#0b0f14; overflow:hidden; touch-action: none; }
    #c { width:100vw; height:100vh; display:block; }
    #ui {
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center; flex-direction:column;
      gap:12px; color:#e8eef7; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 700px at 50% 40%, rgba(60,90,140,0.25), rgba(0,0,0,0.85));
      padding: 24px;
    }
    #start {
      border:0; border-radius:14px; padding:14px 18px;
      font-weight:700; font-size:16px;
      background:#1f6feb; color:white;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    #hint { opacity:.85; max-width: 34em; text-align:center; }
    #small { opacity:.6; font-size:13px; text-align:center; max-width: 38em; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">
    <button id="start">Tap to Start</button>
    <div id="hint">スマホをグラスだと思って傾けてください。傾けすぎるとこぼれて減ります。</div>
    <div id="small">※iPhoneはセンサー利用許可が必要です。HTTPSで開いてください。</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // Render scale (lower = faster). You can tweak on weak phones.
  const RENDER_SCALE = 1.0;

  function resize() {
    const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    canvas.width  = Math.floor(innerWidth  * dpr * RENDER_SCALE);
    canvas.height = Math.floor(innerHeight * dpr * RENDER_SCALE);
  }
  addEventListener("resize", resize, {passive:true});
  resize();

  // Gravity vector (screen-ish). We’ll smooth it.
  let gTarget = {x: 0, y: 1};  // downwards
  let g = {x: 0, y: 1};

  // Liquid state
  let fill = 0.75;          // 0..1
  let foam = 0.55;          // 0..1 (visual strength)
  let temperature = 0.0;    // motion energy for foam jiggle

  // Drip particles
  const drips = [];
  function spawnDrip(x, y, vx, vy, n=2) {
    for (let i=0;i<n;i++){
      drips.push({
        x, y,
        vx: vx + (Math.random()-0.5)*40,
        vy: vy + (Math.random()-0.5)*40,
        r: 2 + Math.random()*3,
        life: 0.8 + Math.random()*0.6
      });
    }
  }

  // Foam blobs (metaball-ish by additive blurred circles)
  const blobs = [];
  const BLOB_N = 24;
  function initBlobs() {
    blobs.length = 0;
    for (let i=0;i<BLOB_N;i++){
      blobs.push({
        u: Math.random(), // along surface
        v: Math.random(), // thickness
        r: 18 + Math.random()*26,
        w: (Math.random()*2-1) * 0.16
      });
    }
  }
  initBlobs();

  // Orientation helper: rotate accel to match screen angle roughly
  function rotateByScreenAngle(x, y) {
    const angle = (screen.orientation && typeof screen.orientation.angle === "number")
      ? screen.orientation.angle
      : (typeof window.orientation === "number" ? window.orientation : 0);

    const rad = angle * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);
    // Rotate (x,y) by +rad
    return { x: x*c - y*s, y: x*s + y*c };
  }

  async function enableMotion() {
    // iOS permission flow
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== "granted") throw new Error("DeviceMotion permission denied");
    }

    window.addEventListener("devicemotion", (e) => {
      const a = e.accelerationIncludingGravity;
      if (!a) return;

      // Use x,y only (good enough for "tilt-to-spill" feel)
      let ax = a.x || 0;
      let ay = a.y || 0;

      // Rotate to match screen orientation (roughly)
      const r = rotateByScreenAngle(ax, ay);
      ax = r.x; ay = r.y;

      const len = Math.hypot(ax, ay) || 1;
      // Target gravity direction in screen coords where +y is down
      gTarget.x = ax / len;
      gTarget.y = ay / len;
    }, { passive: true });
  }

  // Touch: "drink" / "refill" gestures (optional nicety)
  let touchMode = null;
  let lastTapTime = 0;
  addEventListener("pointerdown", (e) => {
    // Double-tap to refill
    const t = performance.now();
    if (t - lastTapTime < 300) {
      fill = 0.9;
      foam = 0.6;
      temperature = 0.0;
    }
    lastTapTime = t;

    // Long press to "drink" slowly
    touchMode = { t0: t };
  }, {passive:true});

  addEventListener("pointerup", () => { touchMode = null; }, {passive:true});
  addEventListener("pointercancel", () => { touchMode = null; }, {passive:true});

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function drawGlass(w,h){
    const pad = Math.min(w,h)*0.06;
    const rim = pad*1.1;

    // Frame / vignette
    ctx.save();
    ctx.globalAlpha = 1;
    const grd = ctx.createRadialGradient(w*0.5,h*0.45, Math.min(w,h)*0.1, w*0.5,h*0.45, Math.max(w,h)*0.7);
    grd.addColorStop(0, "rgba(120,160,220,0.18)");
    grd.addColorStop(1, "rgba(0,0,0,0.85)");
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,w,h);
    ctx.restore();

    // Glass outline
    ctx.save();
    ctx.lineWidth = Math.max(2, Math.min(w,h)*0.01);
    ctx.strokeStyle = "rgba(220,240,255,0.28)";
    ctx.fillStyle = "rgba(255,255,255,0.03)";

    const x0 = pad, y0 = pad*1.3;
    const x1 = w-pad, y1 = h-pad*1.2;

    const r = pad*0.9;
    ctx.beginPath();
    // rounded rect
    ctx.moveTo(x0+r, y0);
    ctx.arcTo(x1, y0, x1, y0+r, r);
    ctx.arcTo(x1, y1, x1-r, y1, r);
    ctx.arcTo(x0, y1, x0, y1-r, r);
    ctx.arcTo(x0, y0, x0+r, y0, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Rim highlight
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth *= 0.6;
    ctx.beginPath();
    ctx.moveTo(x0+rim, y0+rim);
    ctx.lineTo(x1-rim, y0+rim);
    ctx.stroke();

    ctx.restore();

    return {x0,y0,x1,y1,pad};
  }

  // Compute liquid surface line: y = yMid + slope*(x - cx)
  function liquidSurface(w,h, box){
    const cx = (box.x0+box.x1)*0.5;
    const liquidHeight = (box.y1 - box.y0) * fill;

    // Base surface level measured from bottom (y1) upwards
    let yMid = box.y1 - liquidHeight;

    // Tilt slope: driven by gravity x. Clamped for stability
    // More tilt => bigger slope
    const tilt = clamp(-g.x, -1, 1);
    const maxSlope = 0.9; // visual tilt limit
    const slope = clamp(tilt * 1.2, -maxSlope, maxSlope);

    return {cx, yMid, slope};
  }

  function clipToGlass(box){
    ctx.beginPath();
    ctx.rect(box.x0, box.y0, box.x1-box.x0, box.y1-box.y0);
    ctx.clip();
  }

  function drawLiquid(w,h, box, surf){
    const {cx, yMid, slope} = surf;

    // Liquid polygon = intersection of below-half-plane with glass rect
    // Line: y = yMid + slope*(x-cx)
    const yL = yMid + slope*(box.x0 - cx);
    const yR = yMid + slope*(box.x1 - cx);

    ctx.save();
    clipToGlass(box);

    // Fill liquid body below the line
    ctx.beginPath();
    ctx.moveTo(box.x0, yL);
    ctx.lineTo(box.x1, yR);
    ctx.lineTo(box.x1, box.y1);
    ctx.lineTo(box.x0, box.y1);
    ctx.closePath();

    // Beer-ish gradient
    const g1 = ctx.createLinearGradient(0, box.y0, 0, box.y1);
    g1.addColorStop(0, "rgba(255, 200, 90, 0.78)");
    g1.addColorStop(1, "rgba(195, 110, 30, 0.92)");
    ctx.fillStyle = g1;
    ctx.fill();

    // Surface highlight
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = Math.max(1.5, Math.min(w,h)*0.004);
    ctx.beginPath();
    ctx.moveTo(box.x0, yL);
    ctx.lineTo(box.x1, yR);
    ctx.stroke();

    ctx.restore();

    return { yL, yR };
  }

  function drawFoam(w,h, box, surf, edge){
    const {cx, yMid, slope} = surf;
    const {yL, yR} = edge;

    // Foam only if there is enough fill
    if (fill < 0.05) return;

    ctx.save();
    clipToGlass(box);

    // Region: above liquid line but within a small thickness
    // We'll just draw blobs near the surface line.
    ctx.globalCompositeOperation = "lighter"; // additive = metaball-ish merge

    // Soft white foam
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.filter = "blur(8px)";

    // “energy” makes foam jiggle more when moving
    const jiggle = 1 + clamp(temperature*0.9, 0, 1.3);

    for (const b of blobs){
      // Slide along surface
      b.u = (b.u + b.w*(0.016*jiggle)) % 1;
      if (b.u < 0) b.u += 1;

      const x = box.x0 + b.u*(box.x1-box.x0);

      // Surface y at x
      const y = yMid + slope*(x - cx);

      // Push foam toward top side when tilted (looks like it gathers)
      const bias = clamp(-g.x, -1, 1) * 18; // foam shift
      const y2 = y - 14 - b.v*22 + (Math.random()-0.5)*2*jiggle;
      const x2 = x + bias + (Math.random()-0.5)*2*jiggle;

      const r = b.r * (0.6 + foam*0.7);
      ctx.beginPath();
      ctx.arc(x2, y2, r, 0, Math.PI*2);
      ctx.fill();
    }

    // Crisp layer on top
    ctx.filter = "blur(2px)";
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.globalCompositeOperation = "screen";
    ctx.beginPath();
    ctx.moveTo(box.x0, yL-10);
    ctx.lineTo(box.x1, yR-10);
    ctx.lineTo(box.x1, yR-1);
    ctx.lineTo(box.x0, yL-1);
    ctx.closePath();
    ctx.fill();

    ctx.filter = "none";
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }

  function updateSpill(w,h, box, surf, edge, dt){
    const {cx, yMid, slope} = surf;
    const {yL, yR} = edge;

    // Spill when the surface line rises above the rim (top of glass box).
    // If y at any side is above y0 => means liquid would touch/overflow rim.
    const rimY = box.y0;
    const overflowL = rimY - yL; // positive => line is above rim => overflow
    const overflowR = rimY - yR;

    // Choose side that overflows more
    let overflow = 0;
    let side = 0; // -1 left, +1 right
    if (overflowL > overflowR) { overflow = overflowL; side = -1; }
    else { overflow = overflowR; side = +1; }

    const tiltMag = Math.hypot(g.x, g.y);
    const speed = Math.hypot(g.x - gTarget.x, g.y - gTarget.y);

    // Increase "temperature" with motion/tilt
    temperature = clamp(temperature + (speed*2.0 + Math.abs(g.x)*0.4)*dt, 0, 1.5);
    temperature *= Math.pow(0.4, dt); // decay

    if (overflow > 0.5 && fill > 0.0) {
      // Spill rate grows with overflow and tilt
      const spillRate = (overflow / (box.y1-box.y0)) * (0.35 + Math.abs(g.x)*0.9);
      fill = clamp(fill - spillRate*dt, 0, 1);

      // Foam reduces slowly as you spill/drink
      foam = clamp(foam - spillRate*0.25*dt, 0, 1);

      // Emit drips from the overflowing rim side
      const x = (side < 0) ? box.x0 + 8 : box.x1 - 8;
      const y = box.y0 + 6;
      const vx = side * (90 + Math.random()*60);
      const vy = 90 + Math.random()*60;
      spawnDrip(x, y, vx, vy, 2 + (overflow>20 ? 2 : 0));
    }

    // Long-press "drink" (optional)
    if (touchMode) {
      fill = clamp(fill - 0.08*dt, 0, 1);
      foam = clamp(foam - 0.03*dt, 0, 1);
    }
  }

  function updateDrips(w,h, dt){
    for (let i=drips.length-1;i>=0;i--){
      const p = drips[i];
      p.life -= dt;
      p.vy += 520*dt;
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.vx *= Math.pow(0.98, dt*60);
      if (p.life <= 0 || p.y > h + 50) drips.splice(i,1);
    }
  }

  function drawDrips(){
    if (!drips.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255, 215, 120, 0.45)";
    ctx.filter = "blur(1px)";
    for (const p of drips){
      const a = clamp(p.life, 0, 1);
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.filter = "none";
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }

  function drawHUD(w,h){
    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = "rgba(240,248,255,0.65)";
    ctx.font = `${Math.max(12, Math.round(Math.min(w,h)*0.028))}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    ctx.fillText(`fill ${(fill*100)|0}%`, 14, 28);
    ctx.globalAlpha = 0.45;
    ctx.font = `${Math.max(11, Math.round(Math.min(w,h)*0.022))}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    ctx.fillText(`double-tap: refill / press: drink`, 14, 52);
    ctx.restore();
  }

  let running = false;
  let last = performance.now();

  function frame(now){
    if (!running) return;
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;

    // Smooth gravity
    const a = 1 - Math.pow(0.001, dt); // smoothing factor
    g.x = g.x + (gTarget.x - g.x)*a;
    g.y = g.y + (gTarget.y - g.y)*a;

    const w = canvas.width, h = canvas.height;

    // Clear
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,w,h);

    const box = drawGlass(w,h);
    const surf = liquidSurface(w,h, box);
    const edge = drawLiquid(w,h, box, surf);

    updateSpill(w,h, box, surf, edge, dt);

    // draw foam after spill update (so it responds)
    drawFoam(w,h, box, surf, edge);

    updateDrips(w,h, dt);
    drawDrips();

    drawHUD(w,h);

    requestAnimationFrame(frame);
  }

  // Start button
  const ui = document.getElementById("ui");
  document.getElementById("start").addEventListener("click", async () => {
    try {
      await enableMotion();
    } catch (e) {
      // If permission denied, still allow mouse/drag fallback on desktop
      console.warn(e);
    }

    // Desktop / no sensor fallback: drag to simulate tilt
    let dragging = false;
    let lastX = 0, lastY = 0;
    window.addEventListener("pointerdown", (ev)=>{ dragging=true; lastX=ev.clientX; lastY=ev.clientY; }, {passive:true});
    window.addEventListener("pointermove", (ev)=>{
      if (!dragging) return;
      const dx = (ev.clientX-lastX)/Math.max(1,innerWidth);
      const dy = (ev.clientY-lastY)/Math.max(1,innerHeight);
      lastX=ev.clientX; lastY=ev.clientY;
      // Update target gravity from drag
      gTarget.x = clamp(gTarget.x + dx*2.2, -1, 1);
      gTarget.y = clamp(gTarget.y + dy*2.2, -1, 1);
      const len = Math.hypot(gTarget.x, gTarget.y) || 1;
      gTarget.x/=len; gTarget.y/=len;
    }, {passive:true});
    window.addEventListener("pointerup", ()=>{ dragging=false; }, {passive:true});

    ui.style.display = "none";
    running = true;
    last = performance.now();
    requestAnimationFrame(frame);
  });

})();
</script>
</body>
</html>
